<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>abide</title>
<style>
/* ======================================================== design tokens
   White, thin lines, one accent, and a reading column that behaves like a
   page rather than a panel. Light is the default because this app is mostly
   for reading long stretches of text; dark is here for early mornings. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --sunken: #fafafb;
  --hover: #f6f4fd;
  --line: #e8e8ee;
  --line-2: #d6d6de;
  --ink: #16161c;
  --ink-2: #45454f;
  --muted: #83838f;
  --faint: #a9a9b4;
  --accent: #6d4aff;
  --accent-2: #5a37e8;
  --accent-soft: #f0ecff;
  --accent-line: rgba(109, 74, 255, .28);
  --good: #0a7f55;
  --good-soft: #e7f6ef;
  --warn: #91600a;
  --warn-soft: #fdf4e3;
  --critical: #bb2f3c;
  --critical-soft: #fdeeef;
  --on-accent: #ffffff;
  --q0: #f1eefb;
  --q1: #ddd3fa; --q2: #bfaef4; --q3: #9a80ea; --q4: #7856db; --q5: #5a37e8;
  --hl-yellow: #fdf0a8; --hl-green: #cdefcf; --hl-blue: #cfe3fb;
  --hl-pink: #fbd5e4; --hl-orange: #fde1c2; --hl-violet: #e6dafb;
  --sh-1: 0 1px 2px rgba(20, 20, 30, .05);
  --sh-2: 0 2px 6px rgba(20, 20, 30, .07), 0 8px 24px rgba(20, 20, 30, .06);
  --sh-3: 0 18px 50px rgba(20, 20, 30, .18);
  --ring: 0 0 0 3px rgba(109, 74, 255, .18);
  --scrim: rgba(22, 22, 28, .38);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia,
           "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  /* Pitch black, and flat: nothing is lifted by a fill, so every edge in the app is a
     thin border rather than a change of grey. The neutrals stay neutral - only the
     accent is tinted - which is what stops a black theme reading as navy. Overlays are
     the one exception: a shadow is invisible on black, so a popover lifts a hair and
     brightens its border to separate from the page under it. */
  color-scheme: dark;
  --bg: #000000;
  --surface: #000000;
  --sunken: #08080a;               /* a hair recessed, not grey: fills inside a card */
  --raised: #0c0c10;
  --hover: #150f24;
  --line: #26262b;
  --line-2: #3d3d45;
  --ink: #f4f4f6;
  --ink-2: #a8a8b3;
  --muted: #76767f;
  --faint: #55555d;
  --accent: #a78bfa;
  --accent-2: #c4b5fd;
  --accent-soft: #17102a;
  --accent-line: rgba(139, 92, 246, .40);
  --good: #45c98d;
  --good-soft: #082016;
  --warn: #e0a94a;
  --warn-soft: #241a08;
  --critical: #f2727e;
  --critical-soft: #240e11;
  --on-accent: #14101f;
  --q0: #131317;
  --q1: #221a3a; --q2: #35275c; --q3: #4d3684; --q4: #6d4bb8; --q5: #a78bfa;
  --hl-yellow: #423a12; --hl-green: #123018; --hl-blue: #112a48;
  --hl-pink: #3a1626; --hl-orange: #3d240d; --hl-violet: #241c42;
  --sh-1: 0 1px 0 rgba(255, 255, 255, .02);
  --sh-2: 0 2px 10px rgba(0, 0, 0, .9), 0 0 0 1px rgba(255, 255, 255, .03);
  --sh-3: 0 20px 60px rgba(0, 0, 0, .95), 0 0 0 1px rgba(255, 255, 255, .05);
  --ring: 0 0 0 3px rgba(167, 139, 250, .26);
  --scrim: rgba(0, 0, 0, .78);
}
/* the things that float above the page get the hair of lift and the brighter edge */
:root[data-theme="dark"] .modal,
:root[data-theme="dark"] .bookpop,
:root[data-theme="dark"] .seltool,
:root[data-theme="dark"] .timerchip,
:root[data-theme="dark"] .mnote,
:root[data-theme="dark"] .mpanel,
:root[data-theme="dark"] .fntip {
  background: var(--raised);
  border-color: var(--line-2);
}
:root[data-theme="dark"] .fntip { background: #16161b; color: var(--ink); }
:root[data-theme="dark"] .toast { background: #16161b; color: var(--ink);
  border: 1px solid var(--line-2); }
:root[data-theme="dark"] .mnote.draft { background: #1c1509; }
:root[data-theme="dark"] .seg button.on { background: #17171c; }
:root[data-theme="dark"] .mstrip .mday.wend:not(.read):not(.light) { background: #0a0a0c; }
:root[data-theme="dark"] .monthhead { background: #0a0a0c; }
:root[data-theme="dark"] .chip.accent { background: var(--accent-soft); }
:root[data-theme="dark"] .chip.good { background: var(--good-soft); }
:root[data-theme="dark"] .chip.warn { background: var(--warn-soft); }
:root[data-theme="dark"] .scripture { color: #ededf0; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
  font-size: 13.5px; line-height: 1.5; letter-spacing: -.006em;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
h1, h2, h3, h4 { margin: 0; font-weight: 620; letter-spacing: -.018em; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
::selection { background: var(--accent-soft); }
[hidden] { display: none !important; }

/* ============================================================== the shell */
.app { display: flex; flex-direction: column; min-height: 100%; }
header.top {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px;
  padding: 0 18px; height: 52px; background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-weight: 700; font-size: 15.5px; letter-spacing: -.03em; color: var(--ink);
  display: flex; align-items: baseline; gap: 7px;
}
.brand small { font-weight: 500; font-size: 11px; color: var(--faint); letter-spacing: 0; }
nav.tabs { display: flex; gap: 2px; margin-left: 6px; }
nav.tabs button {
  padding: 6px 11px; border-radius: 7px; color: var(--ink-2); font-weight: 500;
  font-size: 13px; transition: background .12s, color .12s;
}
nav.tabs button:hover { background: var(--hover); color: var(--ink); }
nav.tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.tabs button .badge {
  display: inline-block; min-width: 17px; padding: 0 4px; margin-left: 6px;
  border-radius: 9px; background: var(--accent); color: var(--on-accent);
  font-size: 10.5px; font-weight: 700; text-align: center; line-height: 16px;
}
.spacer { flex: 1; }
.searchbox {
  display: flex; align-items: center; gap: 7px; width: 260px; padding: 6px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--sunken);
  color: var(--muted); transition: box-shadow .12s, border-color .12s;
}
.searchbox:focus-within { border-color: var(--accent); box-shadow: var(--ring); background: var(--surface); }
.searchbox input { flex: 1; min-width: 0; border: 0; outline: none; background: none; color: var(--ink); }
.iconb {
  display: inline-flex; align-items: center; justify-content: center; width: 30px;
  height: 30px; border-radius: 7px; color: var(--muted); transition: background .12s;
}
.iconb:hover { background: var(--hover); color: var(--ink); }
main { flex: 1; padding: 22px 18px 90px; }
.wrap { max-width: 1180px; margin: 0 auto; }
.wrap.narrow { max-width: 900px; }

/* =============================================================== elements */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
}
.card + .card { margin-top: 14px; }
.card .hd {
  display: flex; align-items: center; gap: 10px; padding: 12px 15px;
  border-bottom: 1px solid var(--line);
}
.card .hd h3 { font-size: 13.5px; }
.card .bd { padding: 15px; }
.card .bd.tight { padding: 0; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px;
  border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface);
  font-weight: 550; font-size: 13px; color: var(--ink); box-shadow: var(--sh-1);
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { background: var(--hover); border-color: var(--accent-line); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: var(--on-accent);
}
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; box-shadow: none; background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
.btn.wide { width: 100%; justify-content: center; }
.btn:disabled { opacity: .45; cursor: default; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px;
  border: 1px solid var(--line); border-radius: 20px; background: var(--sunken);
  font-size: 11.5px; color: var(--ink-2); white-space: nowrap;
}
.chip.accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.chip.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
label.field { display: block; margin-bottom: 12px; }
label.field > span {
  display: block; margin-bottom: 4px; font-size: 11.5px; font-weight: 600;
  color: var(--ink-2); letter-spacing: .01em;
}
label.field > em { display: block; margin-bottom: 5px; font-size: 11.5px; color: var(--faint); font-style: normal; }
input[type=text], input[type=number], input[type=time], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--surface); color: var(--ink); outline: none;
  transition: border-color .12s, box-shadow .12s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: var(--ring); }
textarea { resize: vertical; min-height: 62px; line-height: 1.55; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrapped { flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.sep { height: 1px; background: var(--line); margin: 14px 0; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.spin {
  width: 14px; height: 14px; border: 2px solid var(--line-2); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.fade { animation: fade .22s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } }

/* ================================================================== today */
.dayhead { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
.dayhead h1 { font-size: 21px; letter-spacing: -.03em; }
.dayhead .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.metrics { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.metric {
  min-width: 92px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface);
}
.metric .k { font-size: 10.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.metric .v { font-size: 17px; font-weight: 650; letter-spacing: -.02em; margin-top: 1px; }
.metric .v small { font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.week { display: flex; gap: 5px; align-items: center; }
.week .d {
  width: 26px; text-align: center; font-size: 10px; color: var(--faint); font-weight: 600;
}
.week .dot {
  width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-size: 11px;
  color: var(--faint); background: var(--sunken);
}
.week .dot.read { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.week .dot.light { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.week .dot.today { box-shadow: var(--ring); }
.week .dot.future { opacity: .45; }
/* ============================================ the book picker, opened from the header
   Sixty-six books do not belong in a dropdown. This is a panel the width of the card:
   the categories down the left, their books flowing horizontally, and the chapters of
   whichever book you point at along the bottom. */
.card .hd { position: relative; }
.bookpop {
  position: absolute; left: 0; right: 0; top: calc(100% + 7px); z-index: 55;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 11px;
  box-shadow: var(--sh-3); padding: 13px 15px 14px; animation: fade .13s;
}
.bpsec {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); margin: 12px 0 5px; padding-bottom: 3px;
  border-bottom: 1px solid var(--line);
}
.bpsec:first-child { margin-top: 0; }
.bprow { display: flex; gap: 10px; align-items: baseline; padding: 2px 0; }
.bplab {
  flex: none; width: 104px; text-align: right; font-size: 10px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; color: var(--faint);
  padding-top: 4px;
}
.bpbooks { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.bpbook {
  display: inline-flex; align-items: baseline; gap: 4px; padding: 3px 8px;
  border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--ink-2);
  white-space: nowrap;
}
.bpbook:hover { background: var(--hover); border-color: var(--accent-line); color: var(--ink); }
.bpbook i { font-style: normal; font-size: 9.5px; color: var(--faint); }
.bpbook.some { color: var(--ink); }
.bpbook.some i { color: var(--accent); }
.bpbook.done { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
.bpbook.sel { border-color: var(--accent); box-shadow: var(--ring); color: var(--accent); font-weight: 620; }
.bpbook.here { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.bpfoot {
  margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line);
  display: flex; gap: 12px; align-items: flex-start;
}
.bpfoot .bpname { flex: none; width: 104px; text-align: right; }
.bpfoot .bpname b { display: block; font-size: 12.5px; }
.bpfoot .bpname span { font-size: 10.5px; color: var(--faint); }
.bpbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.bpbar input { flex: 1; }

/* the month across the top of Today: seven days is too short a window to see
   whether the month is going well */
.mstrip { display: flex; gap: 3px; align-items: flex-end; }
.mstrip .mday {
  flex: 1 1 0; min-width: 0; height: 34px; border-radius: 6px; background: var(--q0);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0; font-size: 9px; color: var(--faint); border: 1px solid transparent;
  cursor: pointer; transition: transform .1s;
}
.mstrip .mday:hover { transform: translateY(-2px); }
.mstrip .mday b { font-size: 10.5px; font-weight: 620; font-variant-numeric: tabular-nums; }
.mstrip .mday.read { background: var(--accent); color: var(--on-accent); }
.mstrip .mday.light { background: var(--accent-soft); color: var(--accent); }
.mstrip .mday.future { background: transparent; border: 1px dashed var(--line); }
.mstrip .mday.wend:not(.read):not(.light) { background: var(--sunken); }
.mstrip .mday.today { box-shadow: var(--ring); border-color: var(--accent); }
.mrow { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.mrow .mlab { flex: none; width: 132px; }
.mrow .mlab b { font-size: 13px; font-weight: 650; display: block; }
.mrow .mlab span { font-size: 11px; color: var(--muted); }

.band {
  display: flex; align-items: center; gap: 12px; padding: 11px 15px; border-radius: 10px;
  border: 1px solid var(--warn-soft); background: var(--warn-soft); color: var(--warn);
  margin-bottom: 14px; font-size: 13px;
}
.band.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.band b { font-weight: 650; }
.band .btn { margin-left: auto; }

/* ============================================================ the passage */
.reader { padding: 4px 0 8px; }
.reader .plabel {
  font-family: var(--sans); font-size: 11.5px; font-weight: 650; letter-spacing: .06em;
  text-transform: uppercase; color: var(--accent); margin: 26px 0 10px;
}
.reader .plabel:first-child { margin-top: 4px; }
.scripture {
  font-family: var(--serif); font-size: var(--fs, 18px); line-height: 1.72;
  max-width: var(--measure, 34em); color: var(--ink); letter-spacing: -.002em;
}
.scripture.sans { font-family: var(--sans); line-height: 1.68; letter-spacing: -.008em; }
.scripture p { margin: 0 0 .85em; }
.scripture p.poet1 { margin: 0; padding-left: 1.4em; text-indent: -.7em; }
.scripture p.poet2 { margin: 0; padding-left: 2.8em; text-indent: -.7em; }
.scripture p.poet3 { margin: 0; padding-left: 4.2em; text-indent: -.7em; }
.scripture p.sp { margin: 0 0 .3em; padding-left: 1.4em; }
.scripture p.speaker { margin: .5em 0 .2em; padding-left: 1.4em; font-style: italic; }
.scripture p.extract, .scripture p.citation { padding-left: 1.6em; font-size: .95em; }
.scripture p.list { padding-left: 1.6em; margin: 0 0 .2em; }
.scripture p.acrostic { margin: 0; padding-left: 1.4em; }
.scripture p.spaced { margin-top: .8em; }
.scripture h4.subhead {
  font-family: var(--sans); font-size: .74em; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--muted); margin: 1.7em 0 .6em;
}
.scripture h4.subhead:first-child { margin-top: 0; }
.scripture p.title {
  font-style: italic; color: var(--ink-2); font-size: .92em; margin: 0 0 .8em;
}
.scripture .vn {
  font-family: var(--sans); font-size: .58em; font-weight: 700; color: var(--faint);
  vertical-align: .42em; margin-right: .28em; letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}
.scripture .vt { border-radius: 3px; }
.scripture .vt.sel { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
.scripture .red { color: #a6323d; }
:root[data-theme="dark"] .scripture .red { color: #f08b95; }
.scripture .sc, .scripture .subhead-sc { font-variant: small-caps; letter-spacing: .02em; }
.scripture .fn {
  font-family: var(--sans); font-size: .62em; vertical-align: .4em; color: var(--accent);
  cursor: help; padding: 0 1px; font-weight: 700;
}
.scripture.nofn .fn { display: none; }
.scripture.nored .red { color: inherit; }
.scripture mark { background: var(--hl-yellow); color: inherit; padding: 0 .05em; }
.hl-yellow { background: var(--hl-yellow); }
.hl-green { background: var(--hl-green); }
.hl-blue { background: var(--hl-blue); }
.hl-pink { background: var(--hl-pink); }
.hl-orange { background: var(--hl-orange); }
.hl-violet { background: var(--hl-violet); }
.hasnote { border-bottom: 2px solid var(--accent-line); }

/* the little toolbar that appears when you select verses */
.seltool {
  position: fixed; z-index: 60; display: flex; align-items: center; gap: 6px;
  padding: 7px 8px; border-radius: 11px; background: var(--surface);
  border: 1px solid var(--line-2); box-shadow: var(--sh-2);
}
.seltool .sw {
  width: 20px; height: 20px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12);
}
.seltool .vbar { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
.fntip {
  position: fixed; z-index: 70; max-width: 320px; padding: 9px 11px; border-radius: 9px;
  background: var(--ink); color: var(--bg); font-family: var(--sans); font-size: 12px;
  line-height: 1.45; box-shadow: var(--sh-2);
}
.timerchip {
  position: fixed; right: 20px; bottom: 20px; z-index: 45; display: flex; gap: 10px;
  align-items: center; padding: 9px 13px; border-radius: 30px; background: var(--surface);
  border: 1px solid var(--line-2); box-shadow: var(--sh-2); font-size: 12.5px;
}
.timerchip .bar { width: 74px; height: 5px; border-radius: 3px; background: var(--q0); overflow: hidden; }
.timerchip .bar i { display: block; height: 100%; background: var(--accent); transition: width .5s linear; }

/* ======================================== comments in the margin, like a document
   The text keeps its measure and the gutter takes the slack, so a wide window gets
   wider comments rather than a wider empty strip. Comments are compact until you open
   one, and any that land on the same few lines share a card instead of each claiming a
   row of their own. Below the point where a gutter would be too narrow to read, they
   fold into a list under the passage. */
.readwrap {
  display: grid; justify-content: center;
  grid-template-columns: minmax(0, var(--measurepx, 620px)) minmax(206px, 360px);
  gap: clamp(18px, 2.2vw, 38px); align-items: start;
}
.readcol { min-width: 0; }
.margincol { position: relative; min-height: 26px; }
.marginhead {
  display: flex; align-items: center; gap: 8px; padding-bottom: 7px;
  border-bottom: 1px solid var(--line); margin-bottom: 4px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--faint);
}
.marginhead button { font-size: 10.5px; color: var(--accent); font-weight: 600; }
@media (max-width: 1000px) {
  .readwrap { grid-template-columns: 1fr; gap: 0; }
  .margincol { display: none; }
}
.mnote {
  position: absolute; left: 0; width: 100%; padding: 7px 9px 8px; font-size: 12px;
  border: 1px solid var(--line); border-left: 2.5px solid var(--line-2);
  border-radius: 8px; background: var(--surface); box-shadow: var(--sh-1);
  transition: top .18s cubic-bezier(.2,.7,.3,1), box-shadow .12s, border-color .12s;
  cursor: default;
}
.mnote.collapsed { cursor: pointer; }
.mnote:hover, .mnote.open {
  border-color: var(--accent-line); border-left-color: var(--accent);
  box-shadow: var(--sh-2); z-index: 4;
}
.mnote::before {                       /* the rule that ties a card to its line */
  content: ""; position: absolute; left: -18px; top: 12px; width: 15px; height: 1px;
  background: var(--line-2);
}
.mnote:hover::before, .mnote.open::before { background: var(--accent); }
.mline + .mline { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.mref {
  display: flex; align-items: baseline; gap: 6px; font-size: 10.5px; font-weight: 700;
  color: var(--accent); letter-spacing: .01em;
}
.mref .x { margin-left: auto; color: var(--faint); font-weight: 500; font-size: 10px; }
.mtext {
  color: var(--ink-2); margin-top: 3px; line-height: 1.45; overflow: hidden;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
}
.mnote.open .mtext { -webkit-line-clamp: unset; display: block; white-space: pre-wrap; }
.macts { display: none; gap: 3px; margin-top: 6px; }
.mnote.open .macts { display: flex; }
.mnote .fade-more {
  font-size: 10px; color: var(--faint); margin-top: 2px;
}
.mnote.open .fade-more { display: none; }
.mnote.draft { border-left-color: var(--warn); background: var(--warn-soft); }
.mnote.draft::before { background: var(--warn); }
.mnote textarea {
  margin-top: 5px; min-height: 46px; font-size: 12px; padding: 5px 7px; line-height: 1.45;
  overflow: hidden;
}
/* the writing panel, at the foot of the gutter rather than under the passage:
   the space below the last comment was empty, and this is what belongs in it */
.mpanel {
  position: absolute; left: 0; width: 100%; padding: 10px 11px 11px;
  border: 1px solid var(--accent-line); border-radius: 9px; background: var(--accent-soft);
  transition: top .18s cubic-bezier(.2,.7,.3,1);
}
.mphead {
  font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 7px; display: flex; align-items: center; gap: 6px;
}
.mpanel select, .mpanel input, .mpanel textarea {
  font-size: 12px; padding: 5px 7px; background: var(--surface);
}
.mpanel textarea { min-height: 44px; line-height: 1.45; margin-bottom: 7px; }
.mpanel .row { gap: 6px; }
.mpanel .btn { font-size: 11.5px; padding: 5px 9px; }
.mpanel .hint { font-size: 10.5px; color: var(--muted); line-height: 1.4; }

.mkind {
  font-size: 9.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--faint); padding: 0 4px; border: 1px solid var(--line); border-radius: 4px;
}
.mkindsel {
  width: auto; font-size: 9.5px; padding: 1px 3px; border-radius: 4px;
  color: var(--muted); background: var(--surface); border: 1px solid var(--line);
}
.mverse {
  font-family: var(--serif); font-size: 12px; color: var(--muted); line-height: 1.4;
  margin: 4px 0 2px; padding-left: 7px; border-left: 2px solid var(--line);
}
.mflab {
  font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--faint); margin: 6px 0 1px;
}
.dhint { font-size: 10px; color: var(--muted); align-self: center; }
#commentstack { margin-top: 16px; }
#commentstack .mnote { position: static !important; width: 100%; }
#commentstack .mnote::before { display: none; }
#commentstack .margintip { position: static; }

.margintip {
  position: absolute; left: 0; width: 100%; padding: 9px 11px; border-radius: 8px;
  border: 1px dashed var(--line-2); color: var(--muted); font-size: 11.5px;
  background: var(--sunken); line-height: 1.45;
}
.scripture .vt.hasnote {
  background: linear-gradient(transparent 84%, var(--accent-soft) 0);
  border-bottom: 0;
}
.scripture .vt.anchor { background: var(--accent-soft); }

/* ============================================== a verse number you can write on */
.scripture .vn { cursor: pointer; border-radius: 3px; padding: 0 1px; }
.scripture .vn:hover { background: var(--accent); color: var(--on-accent); }
.scripture .vt.drafting { background: var(--accent-soft); }

/* =========================================== the day / week / month switch */
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 9px; background: var(--sunken); }
.seg button {
  padding: 5px 14px; border-radius: 7px; font-size: 12.5px; color: var(--ink-2);
  font-weight: 550;
}
.seg button.on { background: var(--surface); color: var(--accent); box-shadow: var(--sh-1); }
/* the day rows: a calendar chit, what was read, and the numbers, right-aligned */
.logday {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) 176px; gap: 18px;
  padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: start;
}
.logday:last-child { border-bottom: 0; }
.logday:hover { background: var(--sunken); }
.chit {
  border: 1px solid var(--line); border-radius: 10px; text-align: center;
  padding: 5px 0 7px; background: var(--sunken);
}
.chit .dw {
  font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--faint);
}
.chit .dn { font-size: 19px; font-weight: 650; line-height: 1.15; font-variant-numeric: tabular-nums; }
.chit.met { background: var(--accent-soft); border-color: var(--accent-line); }
.chit.met .dn, .chit.met .dw { color: var(--accent); }
.logwhat { font-family: var(--serif); font-size: 16px; line-height: 1.35; letter-spacing: -.01em; }
.logbooks { font-size: 11.5px; color: var(--faint); margin-top: 3px; }
.logsits { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.logsits button.chip { cursor: pointer; }
.chip.drop { cursor: pointer; padding: 2px 6px; color: var(--faint); }
.chip.drop:hover { color: var(--critical); border-color: var(--critical); }
.logsits span {
  font-size: 11px; padding: 2px 7px; border-radius: 5px; background: var(--sunken);
  border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums;
}
.logmeta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.logmeta .big { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.logmeta .big small { font-size: 11px; color: var(--muted); font-weight: 500; }
.minbar { width: 150px; height: 6px; border-radius: 3px; background: var(--q0); overflow: hidden; }
.minbar i { display: block; height: 100%; background: var(--q3); }
.monthhead {
  padding: 9px 16px; background: var(--sunken); border-bottom: 1px solid var(--line);
  border-top: 1px solid var(--line); font-size: 11px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
  display: flex; gap: 12px; align-items: baseline;
}
.monthhead span { font-weight: 500; letter-spacing: 0; text-transform: none; }

/* the week rows: a real seven-day strip you can read at a glance */
.logweek {
  display: grid; grid-template-columns: 186px minmax(0, 1fr) 168px; gap: 20px;
  padding: 15px 16px; border-bottom: 1px solid var(--line); align-items: center;
}
.logweek:last-child { border-bottom: 0; }
.logweek:hover { background: var(--sunken); }
.wkstrip { display: flex; gap: 5px; }
.wkstrip .cell {
  flex: 1; height: 46px; border-radius: 8px; background: var(--q0); display: flex;
  flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-size: 9.5px; color: var(--faint); border: 1px solid transparent;
}
.wkstrip .cell b { font-size: 11.5px; font-variant-numeric: tabular-nums; }
.wkstrip .cell.read { background: var(--accent); color: var(--on-accent); }
.wkstrip .cell.light { background: var(--accent-soft); color: var(--accent); }
.wkstrip .cell.future { background: transparent; border: 1px dashed var(--line); }
.wkstrip .cell.today { box-shadow: var(--ring); }

/* the month view: an actual calendar */
.monthwrap { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 26px;
  padding: 16px; border-bottom: 1px solid var(--line); align-items: start; }
.monthgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.monthgrid .h {
  font-size: 9.5px; font-weight: 700; color: var(--faint); text-align: center;
  text-transform: uppercase; letter-spacing: .06em; padding-bottom: 2px;
}
.mcell {
  aspect-ratio: 1 / 1; border-radius: 8px; background: var(--q0); display: flex;
  flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-size: 11px; color: var(--muted); border: 1px solid transparent;
}
.mcell b { font-size: 12.5px; font-weight: 620; font-variant-numeric: tabular-nums; }
.mcell small { font-size: 9px; opacity: .85; }
.mcell.blank { background: transparent; }
.mcell.future { background: transparent; border: 1px dashed var(--line); }
.mcell.n1 { background: var(--q1); } .mcell.n2 { background: var(--q2); color: var(--ink-2); }
.mcell.n3 { background: var(--q3); color: #fff; } .mcell.n4 { background: var(--q4); color: #fff; }
.mcell.n5 { background: var(--q5); color: var(--on-accent); }
.mcell.today { box-shadow: var(--ring); }
.mstats { display: flex; flex-direction: column; gap: 9px; }
.mstat { display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 1px solid var(--line); padding-bottom: 6px; font-size: 12px; }
.mstat b { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
@media (max-width: 900px) {
  .monthwrap { grid-template-columns: 1fr; }
  .logday { grid-template-columns: 48px 1fr; }
  .logday .logmeta { grid-column: 1 / -1; align-items: flex-start; }
  .logweek { grid-template-columns: 1fr; }
}
.logrow { padding: 13px 15px; border-bottom: 1px solid var(--line); }
.logrow:last-child { border-bottom: 0; }
.logrow:hover { background: var(--sunken); }
.logrow .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.logrow .when { font-weight: 650; font-size: 13.5px; min-width: 168px; }
.logrow .what { font-family: var(--serif); font-size: 14.5px; color: var(--ink); }
.logrow .nums { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.strip { display: flex; gap: 2px; margin-top: 8px; }
.strip i {
  width: 9px; height: 16px; border-radius: 2px; background: var(--q0); display: block;
}
.strip i.read { background: var(--q5); }
.strip i.light { background: var(--q2); }
.strip i.future { background: transparent; border: 1px dashed var(--line); }
.strip.wide i { width: 7px; }
.sittings { margin-top: 9px; display: flex; flex-direction: column; gap: 3px; }
.sittings div { font-size: 12px; color: var(--muted); }
.sittings b { color: var(--ink-2); font-weight: 600; }

/* ============================================ notes, one verse at a time */
.vnotes { display: flex; flex-direction: column; gap: 9px; }
.vnote { display: flex; gap: 10px; align-items: flex-start; }
.vnote .vlab {
  flex: none; width: 108px; padding-top: 8px; font-size: 12px; font-weight: 650;
  color: var(--accent); text-align: right;
}
.vnote .vbody { flex: 1; min-width: 0; }
.vnote .vtext {
  font-family: var(--serif); font-size: 13.5px; color: var(--muted); margin-bottom: 4px;
  line-height: 1.5;
}
.vnote .x { flex: none; padding-top: 6px; }
.pickrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ================================================================ journal */
.methods { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.methods button {
  padding: 5px 10px; border: 1px solid var(--line); border-radius: 20px;
  font-size: 12px; color: var(--ink-2); background: var(--surface);
}
.methods button.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: 600; }
.notelist { display: flex; flex-direction: column; }
.noteitem { padding: 13px 15px; border-bottom: 1px solid var(--line); }
.noteitem:last-child { border-bottom: 0; }
.noteitem:hover { background: var(--sunken); }
.noteitem .top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.noteitem .ref { font-weight: 650; font-size: 12.5px; color: var(--accent); }
.noteitem .body { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; }
.noteitem .body b { color: var(--ink); font-weight: 600; }
.noteitem .acts { display: flex; gap: 4px; margin-left: auto; opacity: 0; transition: opacity .12s; }
.noteitem:hover .acts { opacity: 1; }

/* =================================================================== keep */
.review { max-width: 640px; margin: 0 auto; }
.rcard {
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  padding: 26px 24px; box-shadow: var(--sh-1); min-height: 210px;
  display: flex; flex-direction: column;
}
.rcard .kind {
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 12px;
}
.rcard .prompt {
  font-family: var(--serif); font-size: 21px; line-height: 1.4; letter-spacing: -.015em;
}
.rcard .cue {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px;
  line-height: 2; color: var(--muted); margin-top: 14px; letter-spacing: .04em;
}
.rcard .answer {
  font-family: var(--serif); font-size: 18px; line-height: 1.68; margin-top: 16px;
  padding-top: 16px; border-top: 1px solid var(--line);
}
.rcard .answer.note { font-family: var(--sans); font-size: 14px; white-space: pre-wrap; }
.grades { display: flex; gap: 8px; margin-top: 18px; }
.grades .btn { flex: 1; flex-direction: column; gap: 2px; align-items: center; padding: 9px 6px; }
.grades .btn small { color: var(--muted); font-size: 10.5px; font-weight: 500; }
.grades .btn.g1:hover { border-color: var(--critical); }
.grades .btn.g4:hover { border-color: var(--good); }
.diffline { font-family: var(--serif); font-size: 17px; line-height: 1.7; }
.diffline .ok { color: var(--ink); }
.diffline .miss { color: var(--critical); text-decoration: underline wavy var(--critical); text-underline-offset: 3px; }
.cardtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.cardtable th {
  text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  color: var(--faint);
}
.cardtable td { padding: 9px 12px; border-bottom: 1px solid var(--line); }
.cardtable tr:hover td { background: var(--sunken); }
.cardtable .r { text-align: right; }
.bar { height: 5px; border-radius: 3px; background: var(--q0); overflow: hidden; width: 62px; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* =============================================================== progress */
.mapgroup { margin-bottom: 16px; }
.mapgroup h4 {
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 7px;
}
.bookrow { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
.bookrow .nm {
  width: 118px; flex: none; font-size: 11.5px; color: var(--ink-2); text-align: right;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bookrow .nm.done { color: var(--accent); font-weight: 650; }
.bookrow .cells { display: flex; gap: 2px; flex-wrap: wrap; }
.cell {
  width: 11px; height: 11px; border-radius: 2.5px; background: var(--q0); cursor: pointer;
}
.cell.n1 { background: var(--q1); } .cell.n2 { background: var(--q2); }
.cell.n3 { background: var(--q3); } .cell.n4 { background: var(--q4); }
.cell.n5 { background: var(--q5); }
.cell.part { box-shadow: inset 0 0 0 1.5px var(--accent-line); }
.cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.bookrow .cnt { font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.heat { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 6px; }
.heat .wk { display: flex; flex-direction: column; gap: 3px; }
.heat .day { width: 11px; height: 11px; border-radius: 2.5px; background: var(--q0); }
.heat .day.fut, .ycol .day.fut { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.ycol .day.now { box-shadow: 0 0 0 1.5px var(--accent); }
.ycol .day { width: 11px; height: 11px; border-radius: 2.5px; background: var(--q0); }
.ycol .day.n1 { background: var(--q1); } .ycol .day.n2 { background: var(--q2); }
.ycol .day.n3 { background: var(--q3); } .ycol .day.n4 { background: var(--q4); }
.ycol .day.n5 { background: var(--q5); }
.heat .day.n1 { background: var(--q1); } .heat .day.n2 { background: var(--q2); }
.heat .day.n3 { background: var(--q3); } .heat .day.n4 { background: var(--q4); }
.heat .day.n5 { background: var(--q5); }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 92px; }
.bars .b { flex: 1; background: var(--q2); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.bars .b.met { background: var(--accent); }
.bars .b span {
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  font-size: 9.5px; color: var(--faint); white-space: nowrap;
}
.clockbars { display: flex; align-items: flex-end; gap: 2px; height: 60px; }
.clockbars .b { flex: 1; background: var(--q2); border-radius: 2px 2px 0 0; min-height: 1px; }
.clockbars .b.peak { background: var(--accent); }
/* ==================================================== progress, redesigned
   A page you read top to bottom: where you are in the whole thing, then the whole
   thing laid out, then the year, then the two habits worth watching. */
.hero {
  display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 26px;
  align-items: center; padding: 20px 22px;
}
.arc { position: relative; width: 152px; height: 152px; }
.arc svg { transform: rotate(-90deg); }
.arc .mid {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px;
}
.arc .mid b { font-size: 27px; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
.arc .mid span { font-size: 10.5px; color: var(--muted); }
.herostats { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 4px 18px; }
.hs { padding: 7px 0; }
.hs .k {
  font-size: 10px; font-weight: 600; color: var(--faint); text-transform: uppercase;
  letter-spacing: .06em;
}
.hs .v { font-size: 21px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
.hs .v small { font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.hs .sub { font-size: 10.5px; color: var(--faint); }

.tcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 0; }
.tcol { padding: 15px 18px; }
.tcol + .tcol { border-left: 1px solid var(--line); }
.tcolhd {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px;
  padding-bottom: 7px; border-bottom: 1px solid var(--line);
}
.tcolhd b { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.tcolhd span { font-size: 11px; color: var(--faint); margin-left: auto; font-variant-numeric: tabular-nums; }
.gengroup { margin-bottom: 13px; }
.genhd { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.genhd i {
  font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--faint);
}
.genhd .gbar { flex: 1; height: 3px; border-radius: 2px; background: var(--q0); overflow: hidden; }
.genhd .gbar u { display: block; height: 100%; background: var(--q3); }
.genhd em { font-style: normal; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }

.stalebar {
  position: sticky; top: 0; z-index: 90; display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; padding: 9px 16px; font-size: 12.5px;
  background: var(--warn-soft); color: var(--warn);
  border-bottom: 1px solid var(--warn);
}
.stalebar code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
  padding: 2px 6px; border-radius: 5px; background: rgba(0, 0, 0, .25);
}
.stalebar .btn { margin-left: auto; }

.whenpop {
  position: fixed; z-index: 75; min-width: 190px; max-width: 280px; padding: 11px 13px;
  border-radius: 10px; background: var(--raised, var(--surface));
  border: 1px solid var(--line-2); box-shadow: var(--sh-3); font-size: 12px;
  animation: fade .12s;
}
.whenpop .wtitle { font-weight: 650; font-size: 13px; }
.whenpop .wcount {
  font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--accent); margin: 2px 0 7px;
}
.whenpop .wlist { display: flex; flex-direction: column; gap: 3px; color: var(--ink-2); }
.whenpop .wlist b { font-weight: 600; color: var(--ink); }
.cell { cursor: pointer; }

.legend { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--faint); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.yearwrap { display: flex; gap: 7px; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
.dowcol { display: flex; flex-direction: column; gap: 3px; padding-top: 15px; flex: none; }
.dowcol span { height: 11px; font-size: 8.5px; color: var(--faint); line-height: 11px; }
.yearcols { display: flex; gap: 3px; }
.ycol { display: flex; flex-direction: column; gap: 3px; }
.ycol .mlbl { height: 12px; font-size: 8.5px; color: var(--faint); white-space: nowrap; }
.targetbars { position: relative; height: 104px; display: flex; align-items: flex-end; gap: 5px; }
.targetbars .tline {
  position: absolute; left: 0; right: 0; border-top: 1px dashed var(--accent-line);
}
.targetbars .tline span {
  position: absolute; right: 0; top: -14px; font-size: 9.5px; color: var(--accent);
}
.targetbars .b { flex: 1; background: var(--q2); border-radius: 3px 3px 0 0; min-height: 2px; }
.targetbars .b.met { background: var(--accent); }
.axis { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--faint); margin-top: 5px; }
.kv { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.kv:last-child { border-bottom: 0; }
.kv b { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kv .faint { font-size: 11px; }
.donebooks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.donebooks span {
  font-size: 11px; padding: 2px 7px; border-radius: 5px; background: var(--accent-soft);
  color: var(--accent); border: 1px solid var(--accent-line);
}
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .tcol + .tcol { border-left: 0; border-top: 1px solid var(--line); } }

.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
.stat { padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; }
.stat .k { font-size: 10.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font-size: 19px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 500; }

/* ================================================================== read */
.bookgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 5px; }
.bookgrid button {
  padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px;
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.bookgrid button:hover { background: var(--hover); border-color: var(--accent-line); }
.bookgrid button.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: 600; }
.bookgrid button i { font-style: normal; font-size: 10.5px; color: var(--faint); }
.chgrid { display: flex; flex-wrap: wrap; gap: 4px; }
.chgrid button {
  width: 34px; height: 30px; border: 1px solid var(--line); border-radius: 7px;
  display: flex; align-items: center; justify-content: center; font-size: 12px;
  font-variant-numeric: tabular-nums; color: var(--ink-2);
}
.chgrid button:hover { background: var(--hover); }
.chgrid button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
.chgrid button.read { border-color: var(--accent-line); color: var(--accent); }
.pager { display: flex; align-items: center; gap: 8px; justify-content: space-between; }

/* ================================================================= plans */
.tpl { padding: 14px 15px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; }
.tpl:last-child { border-bottom: 0; }
.tpl:hover { background: var(--sunken); }
.tpl .meat { flex: 1; }
.tpl h4 { font-size: 13.5px; margin-bottom: 3px; }
.tpl p { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 62ch; }
.tpl .side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }

/* ================================================================ modals */
.scrim {
  position: fixed; inset: 0; z-index: 80; background: var(--scrim);
  display: flex; align-items: flex-start; justify-content: center; padding: 60px 18px;
  overflow: auto; animation: fade .15s;
}
.modal {
  width: 100%; max-width: 540px; background: var(--surface); border-radius: 14px;
  border: 1px solid var(--line); box-shadow: var(--sh-3);
}
.modal.wide { max-width: 780px; }
.modal .hd { display: flex; align-items: center; gap: 10px; padding: 14px 17px; border-bottom: 1px solid var(--line); }
.modal .hd h3 { font-size: 15px; }
.modal .bd { padding: 17px; }
.modal .ft { display: flex; gap: 9px; padding: 13px 17px; border-top: 1px solid var(--line); }
.modal .ft .spacer { flex: 1; }
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 100;
  padding: 9px 16px; border-radius: 22px; background: var(--ink); color: var(--bg);
  font-size: 12.5px; box-shadow: var(--sh-2); animation: fade .18s;
}
.toast .tundo {
  margin-left: 12px; color: var(--accent-2); font-weight: 650; text-decoration: underline;
}
kbd {
  font-family: var(--sans); font-size: 10.5px; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--line-2); background: var(--sunken); color: var(--muted);
}

@media (max-width: 820px) {
  header.top { height: auto; flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
  nav.tabs { order: 3; width: 100%; overflow-x: auto; }
  .searchbox { width: 150px; }
  main { padding: 14px 12px 80px; }
  .metrics { margin-left: 0; width: 100%; }
  .bookrow .nm { width: 84px; }
  .scripture { --fs: 17px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">abide <small id="brandnote"></small></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="spacer"></div>
    <div class="searchbox">
      <span class="faint">⌕</span>
      <input id="q" type="text" placeholder="Search or jump to a reference" autocomplete="off">
    </div>
    <button class="iconb" id="themeb" title="Light or dark">◐</button>
  </header>
  <main><div class="wrap" id="view"></div></main>
</div>
<script>
"use strict";
/* =========================================================== small helpers */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));
const mins = n => n == null ? "" : (n < 1 ? "under a minute"
  : n < 60 ? Math.round(n) + " min" : (n / 60).toFixed(1) + " hours");
const clock = s => (s || "").slice(11, 16);
const dayName = s => { try { return new Date(s + "T12:00").toLocaleDateString(undefined,
  { weekday: "short", day: "numeric", month: "short" }); } catch (e) { return s; } };
/* a date far enough out to need its year said out loud */
const dayFar = s => { try {
  const d = new Date(s + "T12:00"), now = new Date();
  return d.toLocaleDateString(undefined, { day: "numeric", month: "long" })
    + (d.getFullYear() !== now.getFullYear() ? " " + d.getFullYear() : "");
} catch (e) { return s; } };
const dayLong = s => { try { return new Date(s + "T12:00").toLocaleDateString(undefined,
  { weekday: "long", day: "numeric", month: "long", year: "numeric" }); } catch (e) { return s; } };
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

let TOAST_T = null;
function toast(msg, ms, action) {
  const old = $(".toast"); if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  if (action && action.fn) {
    const b = document.createElement("button");
    b.className = "tundo";
    b.textContent = action.label || "undo";
    b.addEventListener("click", () => { el.remove(); action.fn(); });
    el.appendChild(b);
  }
  document.body.appendChild(el);
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => el.remove(), ms || 2400);
}

async function API(path, body) {
  try {
    const opts = body === undefined ? {}
      : { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body) };
    const r = await fetch(path, opts);
    const j = await r.json();
    if (j && j.error && j.kind === "api") toast(j.error, 5000);
    return j;
  } catch (e) {
    toast("the app's own server is not answering", 4000);
    return { error: String(e) };
  }
}

/* ================================================================== state */
const S = {
  tab: "today", boot: null, today: null, progress: null, plans: null,
  reader: null,                       /* the live reading session */
  jumpVerse: null,                         /* a verse to scroll to once it is drawn */
  keep: { queue: [], i: 0, shown: false, recite: false, result: null, cards: null,
          projects: null, notes: null, pane: "comments" },
  journal: { notes: null, filter: { abbr: "", kind: "", q: "", starred: 0 } },
  sel: null, search: null, modal: null,
  log: { grain: "day", data: null, looks: false },
  marginOpen: new Set(),                   /* which comments are expanded */
  drafts: [],                              /* comment boxes open but not yet saved */
};
const TABS = [
  { id: "today", name: "Today" },
  { id: "log", name: "Log" },
  { id: "keep", name: "Keep", badge: () => S.today && S.today.due_count },
  { id: "progress", name: "Progress" },
  { id: "plans", name: "Plans" },
  { id: "settings", name: "Settings" },
];
const st = k => (S.boot && S.boot.settings ? S.boot.settings[k] : "");

/* ============================================================== the shell */
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(t => {
    const n = t.badge ? t.badge() : 0;
    return `<button data-tab="${t.id}" class="${S.tab === t.id ? "on" : ""}">${t.name}` +
      (n ? `<span class="badge">${n}</span>` : "") + `</button>`;
  }).join("");
}
/* The interface comes off disk on every reload; the server does not. When they are out
   of step the page will ask for things the running server has never heard of, so say so
   plainly rather than showing a confidently wrong answer. */
function staleBanner() {
  const old = $("#stalebar"); if (old) old.remove();
  if (!S.boot || !S.boot.stale) return;
  const el = document.createElement("div");
  el.id = "stalebar"; el.className = "stalebar";
  el.innerHTML = `<b>The app has been edited since the server started</b>
    - this page is newer than the server answering it, so some things will look wrong.
    <code>pkill -f "abide.py serve" &amp;&amp; python3 abide.py serve</code>
    <button class="btn sm" id="copyrestart">copy</button>`;
  document.body.insertBefore(el, document.body.firstChild);
  $("#copyrestart").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(
        'pkill -f "abide.py serve" && cd ~/code/abide && python3 abide.py serve');
      toast("copied - paste it in a terminal");
    } catch (e) { toast("could not reach the clipboard"); }
  });
}

function applySettings() {
  const s = S.boot.settings;
  document.documentElement.dataset.theme = s.theme === "dark" ? "dark" : "light";
  document.documentElement.style.setProperty("--fs", (s.font_size || 18) + "px");
  document.documentElement.style.setProperty("--measure", (s.measure || 34) + "em");
  /* the same measure in pixels, so the reading column can be a grid track and the
     gutter can take whatever is left rather than sitting in a fixed strip */
  document.documentElement.style.setProperty("--measurepx",
    Math.round((Number(s.font_size) || 18) * (Number(s.measure) || 34)) + 26 + "px");
  $("#brandnote").textContent = s.version === "NLT" ? "NLT" : s.version;
}
async function setSetting(k, v) {
  S.boot.settings[k] = String(v);
  applySettings();
  await API("/api/settings", { [k]: String(v) });
}

async function go(tab, opts) {
  if (tab) S.tab = tab;
  renderTabs();
  const v = $("#view");
  v.className = "wrap" + (S.tab === "keep" && !S.keep.pane ? " narrow" : "");
  if (S.tab === "today") await renderToday();
  else if (S.tab === "log") await renderLog();
  else if (S.tab === "keep") await renderKeep();
  else if (S.tab === "progress") await renderProgress();
  else if (S.tab === "plans") await renderPlans();
  else if (S.tab === "settings") renderSettings();
  if (S.tab !== "today") stopTicker();
  if (location.hash.slice(1) !== S.tab) history.replaceState(null, "", "#" + S.tab);
}

function loading(msg) {
  $("#view").innerHTML = `<div class="empty"><span class="spin"></span>
    <div style="margin-top:10px">${esc(msg || "")}</div></div>`;
}

/* ======================================================= rendering scripture */
function marksFor(p) {
  const m = {};
  (p.highlights || []).forEach(h => {
    const a = h.v1 == null ? 1 : h.v1, b = h.v2 == null ? 999 : h.v2;
    for (let v = a; v <= b; v++) (m[v] = m[v] || {}).hl = h.color;
  });
  (p.notes || []).forEach(n => {
    if (n.here && n.here.length) {          /* a verse-by-verse note marks its verses */
      n.here.forEach(v => { (m[v] = m[v] || {}).note = 1; });
      return;
    }
    if (n.v1 == null) return;
    for (let v = n.v1; v <= (n.v2 || n.v1); v++) (m[v] = m[v] || {}).note = 1;
  });
  (p.cards || []).forEach(c => {
    if (c.v1 == null) return;
    for (let v = c.v1; v <= (c.v2 || c.v1); v++) (m[v] = m[v] || {}).kept = 1;
  });
  return m;
}
const BLOCK_TAG = {
  subhead: ['<h4 class="subhead">', "</h4>"],
  "psalm-title": ['<p class="title">', "</p>"],
  poet1: ['<p class="poet1">', "</p>"], poet2: ['<p class="poet2">', "</p>"],
  poet3: ['<p class="poet3">', "</p>"], speaker: ['<p class="speaker">', "</p>"],
  extract: ['<p class="extract">', "</p>"], citation: ['<p class="citation">', "</p>"],
  list: ['<p class="list">', "</p>"], acrostic: ['<p class="acrostic">', "</p>"],
  body: ["<p>", "</p>"],
};
function blocksHtml(p) {
  const m = marksFor(p), seen = new Set();
  let out = "";
  for (const b of p.blocks || []) {
    const pair = BLOCK_TAG[b.cls] || BLOCK_TAG.body;
    let open = pair[0];
    if (b.sp) open = open.replace(/class="([^"]*)"/, 'class="$1 spaced"')
      .replace(/^<p>$/, '<p class="spaced">');
    if (b.text) { out += open + b.text + pair[1]; continue; }
    let inner = "";
    for (const part of (b.parts || [])) {
      const v = part.v || "";
      let num = "";
      if (v && !seen.has(v) && b.cls !== "psalm-title") {
        num = `<span class="vn">${esc(v)}</span>`; seen.add(v);
      }
      const k = m[Number(String(v).replace(/\D/g, ""))] || {};
      const cls = ["vt", k.hl ? "hl-" + k.hl : "", k.note ? "hasnote" : ""]
        .filter(Boolean).join(" ");
      inner += `<span class="${cls}" data-v="${esc(v)}">${num}${part.html}</span> `;
    }
    out += open + inner + pair[1];
  }
  return out;
}
function passageHtml(p, opts) {
  opts = opts || {};
  if (p.error) {
    return `<div class="plabel">${esc(p.label)}</div>
      <div class="card"><div class="bd">
        <div class="row"><b>${esc(p.error)}</b></div>
        <div class="small muted" style="margin-top:6px">This passage is not in the
        local cache and api.nlt.to could not be reached. Everything you have already
        read still works.</div>
        <div style="margin-top:10px"><button class="btn sm" data-act="retry">Try again</button></div>
      </div></div>`;
  }
  const cls = ["scripture", st("serif") === "1" ? "" : "sans",
    st("footnotes") === "1" ? "" : "nofn", st("red_letters") === "1" ? "" : "nored"]
    .filter(Boolean).join(" ");
  return (opts.label === false ? "" :
    `<div class="plabel">${esc(p.label)}<span class="faint" style="text-transform:none;
      letter-spacing:0;font-weight:500"> · ${p.verse_count} verses · ${mins(p.minutes)}
      ${p.cached ? "" : " · just fetched"}</span></div>`) +
    `<div class="${cls}" data-ref="${esc(p.ref)}" data-abbr="${esc(p.abbr)}"
      data-ch="${p.ch}">${blocksHtml(p)}</div>` +
    ((p.footnotes && p.footnotes.length && st("footnotes") === "1" && opts.notes !== false)
      ? `<details class="small muted" style="margin-top:14px;max-width:var(--measure)">
          <summary style="cursor:pointer">${plural(p.footnotes.length, "translator's note")}</summary>
          <div style="margin-top:8px;display:flex;flex-direction:column;gap:5px">
          ${p.footnotes.map(f => `<div><b class="faint">${esc(f.vn)}</b> ${esc(f.text)}</div>`).join("")}
          </div></details>` : "");
}

/* ============================================================= today
   One page. The plan's reading for today is what it opens with, but the same page
   browses every chapter in the Bible - because "today" and "read" were the same page
   wearing two hats, and switching tabs to look something up broke the sitting. */
/* How long on a passage before it is worth a row in the log. Anything you actually do -
   a comment, a verse kept, pressing "I have read this" - records it at once, so this is
   only about time. Ninety seconds means opening a chapter to check something leaves
   nothing behind at all. */
const LOG_AFTER = 90;

function monthStripHtml(m, w) {
  if (!m || !m.days) return "";
  const met = m.read_count >= m.target;
  return `<div class="mrow">
    <div class="mlab">
      <b>${esc(m.label)}</b>
      <span>${m.read_count} of ${m.elapsed} days${m.per_week
        ? " · " + m.per_week + " a week" : ""}</span>
    </div>
    <div class="mstrip" style="flex:1">${m.days.map(d => `<div
      class="mday ${d.read ? "read" : d.light ? "light" : ""} ${d.future ? "future" : ""}
        ${d.wd >= 5 ? "wend" : ""} ${d.today ? "today" : ""}"
      data-tab="log" title="${d.day}${d.minutes ? " · " + d.minutes + " min"
        : d.future ? "" : " · nothing"}"><b>${d.n}</b>${d.minutes
        ? `<span>${d.minutes}</span>` : ""}</div>`).join("")}</div>
    <div class="mlab" style="width:auto;text-align:right">
      <b class="${met ? "" : ""}" style="color:${met ? "var(--good)" : "var(--ink)"}">
        ${w.count}<span style="font-weight:500;color:var(--muted)"> of 7 this week</span></b>
      <span>${w.met ? "target met" : plural(w.left, "day") + " to reach " + w.target}</span>
    </div>
  </div>`;
}

/* --------------------------------------------------- the passage on screen */
async function openPassage(refs, opts) {
  opts = opts || {};
  const prev = S.reader;
  if (prev && prev.rid && !prev.finished) {         /* leave a record of the last one */
    API("/api/reading/touch", { id: prev.rid, seconds: prev.seconds, scroll: prev.scroll });
  }
  stopTicker();
  S.reader = {
    refs: refs, passages: null, source: opts.source || "pick",
    plan_id: opts.plan_id || 0,
    plan_seq: (opts.plan_seq === undefined ? null : opts.plan_seq),
    rid: null, seconds: 0, scroll: 0, finished: false, label: refs_join(refs),
    verses: 0, est: 120,
  };
  S.noteRef = refs[0] || ""; S.noteRefLabel = "";
  if (!opts.quiet) paintPassage(true);
  const r = await API("/api/passages?refs=" + encodeURIComponent(refs.join(",")));
  if (!S.reader || S.reader.refs !== refs) return;                  /* moved on since */
  const ps = r.passages || [];
  S.reader.passages = ps;
  /* the server says it best: twelve slices of Ezekiel and Jeremiah come back as
     "Ezekiel 24:15-25:17; Jeremiah 34:1-22" rather than as a list */
  S.reader.label = r.label || ps.map(p => p.label).join("; ") || refs_join(refs);
  S.reader.verses = r.verses || ps.reduce((a, p) => a + (p.verse_count || 0), 0);
  S.reader.est = Math.max(45, r.estimated_seconds || Math.round(
    ps.reduce((a, p) => a + (p.words || 0), 0) / 200 * 60));
  S.noteRefLabel = (ps[0] || {}).label || "";
  if (opts.rerender === false) paintPassage(); else renderToday();
}
const refs_join = refs => (refs || []).map(x => String(x).replace(/\./g, " ")).join("; ");

function chapterAfter(dir) {
  const R = S.reader;
  if (!R || !R.passages || !R.passages.length) return null;
  const p = dir > 0 ? R.passages[R.passages.length - 1] : R.passages[0];
  const b = S.boot.books.find(x => x.abbr === p.abbr);
  if (!b) return null;
  let abbr = p.abbr, ch = p.ch + dir;
  if (ch < 1 || ch > b.chapters) {
    const i = S.boot.books.findIndex(x => x.abbr === p.abbr) + dir;
    if (i < 0 || i >= S.boot.books.length) return null;
    abbr = S.boot.books[i].abbr;
    ch = dir > 0 ? 1 : S.boot.books[i].chapters;
  }
  return { abbr: abbr, ch: ch };
}

async function ensureLogged() {
  const R = S.reader;
  if (!R || R.finished) return null;
  if (R.rid) return R.rid;
  const r = await API("/api/reading/start", {
    refs: R.refs, plan_id: R.plan_id, plan_seq: R.plan_seq,
    mode: R.source === "plan" ? "plan" : "free",
  });
  if (r.reading_id) {
    R.rid = r.reading_id;
    API("/api/reading/touch", { id: R.rid, seconds: R.seconds, scroll: R.scroll });
  }
  return R.rid;
}

async function finishReading() {
  const R = S.reader; if (!R || R.finished) return;
  await ensureLogged();
  if (!R.rid) return toast("could not record that");
  const res = await API("/api/reading/finish",
    { id: R.rid, seconds: R.seconds, scroll: R.scroll });
  R.finished = true; R.engaged = res.engaged;
  stopTicker();
  const c = $("#timerchip"); if (c) c.remove();
  toast("Logged as read.");
  S.today = null;
  await renderToday();
}

/* ------------------------------------------------------------- the clock */
let TICK = null;
function startTicker() {
  stopTicker();
  TICK = setInterval(async () => {
    const R = S.reader;
    if (!R || R.finished) return stopTicker();
    if (document.visibilityState !== "visible") return;
    R.seconds += 1;
    const el = $("#tprog"); const lab = $("#tlabel");
    if (el) el.style.width = Math.min(100, 100 * R.seconds / Math.max(30, R.est)) + "%";
    if (lab) lab.textContent = mmss(R.seconds);
    if (R.seconds === LOG_AFTER) await ensureLogged();
    if (R.rid && R.seconds % 20 === 0)
      API("/api/reading/touch", { id: R.rid, seconds: R.seconds, scroll: R.scroll });
  }, 1000);
}
function stopTicker() { if (TICK) { clearInterval(TICK); TICK = null; } }

function afterPassageRender() {
  const R = S.reader;
  renderComments();
  if (S.jumpVerse && R && R.passages) {
    const el = $(`.scripture .vt[data-v="${S.jumpVerse}"]`);
    if (el) {
      el.scrollIntoView({ block: "center", behavior: "smooth" });
      el.classList.add("sel");
      setTimeout(() => el.classList.remove("sel"), 2400);
    }
    S.jumpVerse = null;
  }
  if (!R || R.finished || !R.passages) {
    const c = $("#timerchip"); if (c) c.remove();
    return stopTicker();
  }
  if (!$("#timerchip")) {
    const el = document.createElement("div");
    el.className = "timerchip"; el.id = "timerchip";
    el.title = "time on this passage";
    el.innerHTML = `<span class="mono num" id="tlabel">${mmss(R.seconds)}</span>
      <span class="bar"><i id="tprog" style="width:0%"></i></span>
      <span class="faint tiny">of ${Math.round(R.est / 60)} min</span>`;
    document.body.appendChild(el);
  }
  startTicker();
}

/* -------------------------------------------- switching chapter from the header
   Sixty-six books in a dropdown is a scroll and a guess. This is a panel the width of
   the card: the ten categories down the left, their books flowing across, and the
   chapters of whichever book you are pointing at along the bottom. Books you have
   finished are filled in, books you are partway through say how far. */
const GENRE_ORDER = ["law", "history", "wisdom", "prophets", "minor",
                     "gospel", "acts", "paul", "general", "apocalypse"];
const GENRE_SHORT = {
  law: "Law", history: "History", wisdom: "Wisdom", prophets: "Major prophets",
  minor: "Minor prophets", gospel: "Gospels", acts: "History", paul: "Paul",
  general: "Letters", apocalypse: "Prophecy",
};

function hereRef() {
  const R = S.reader;
  return (R && R.passages && R.passages.length) ? R.passages[0] : null;
}
function readCount(abbr) {
  const m = (S.today && S.today.read_map) || {};
  return (m[abbr] || []).length;
}
function chapterSwitchHtml() {
  const cur = hereRef();
  const b = S.boot.books.find(x => x.abbr === (cur ? cur.abbr : "John")) || S.boot.books[0];
  const label = b.title + (b.chapters > 1 && cur ? " " + cur.ch : "");
  return `<button class="btn sm" data-act="bookpop" title="pick a book and chapter (b)">
      ${esc(label)} <span class="faint">▾</span></button>
    ${S.pick && S.pick.open ? bookPopHtml() : ""}`;
}

function bookPopHtml() {
  const cur = hereRef();
  const q = ((S.pick && S.pick.q) || "").trim().toLowerCase();
  const sel = (S.pick && S.pick.sel) || (cur ? cur.abbr : "John");
  const books = S.boot.books.filter(x => !q
    || x.title.toLowerCase().includes(q) || x.abbr.toLowerCase().includes(q));
  const byGenre = {};
  books.forEach(x => { (byGenre[x.genre] = byGenre[x.genre] || []).push(x); });
  const chip = x => {
    const n = readCount(x.abbr);
    const cls = ["bpbook",
      cur && cur.abbr === x.abbr ? "here" : (x.abbr === sel ? "sel" : ""),
      n >= x.chapters ? "done" : (n ? "some" : "")].filter(Boolean).join(" ");
    return `<button class="${cls}" data-bp="${x.abbr}" title="${esc(x.title)} · ${n} of
      ${x.chapters} chapters read">${esc(x.title)}${n && n < x.chapters
        ? `<i>${n}/${x.chapters}</i>` : (n >= x.chapters ? "<i>✓</i>" : "")}</button>`;
  };
  const rows = t => GENRE_ORDER.filter(g => byGenre[g]
      && byGenre[g][0].testament === t)
    .map(g => `<div class="bprow"><div class="bplab">${esc(GENRE_SHORT[g] || g)}</div>
      <div class="bpbooks">${byGenre[g].map(chip).join("")}</div></div>`).join("");
  const ot = rows("OT"), nt = rows("NT");
  const sb = S.boot.books.find(x => x.abbr === sel) || S.boot.books[0];
  const read = new Set(((S.today && S.today.read_map) || {})[sb.abbr] || []);
  return `<div class="bookpop" id="bookpop">
    <div class="bpbar">
      <input type="text" id="bpq" placeholder="filter the books, or type a reference"
        value="${esc((S.pick && S.pick.q) || "")}" autocomplete="off">
      <span class="small faint">${S.boot.totals.chapters} chapters ·
        ${Object.values((S.today && S.today.read_map) || {})
          .reduce((a, x) => a + x.length, 0)} read</span>
      <button class="btn ghost sm" data-act="bookpopclose">close</button>
    </div>
    ${ot ? `<div class="bpsec">Old Testament</div>${ot}` : ""}
    ${nt ? `<div class="bpsec">New Testament</div>${nt}` : ""}
    ${!ot && !nt ? `<div class="small muted" style="padding:8px 0">nothing matches
      - press enter to try it as a reference</div>` : ""}
    <div class="bpfoot">
      <div class="bpname"><b>${esc(sb.title)}</b>
        <span>${read.size} of ${sb.chapters} read</span></div>
      <div class="chgrid" style="flex:1">${Array.from({ length: sb.chapters },
        (_, i) => i + 1).map(c => `<button data-bpch="${sb.abbr}.${c}"
          class="${cur && cur.abbr === sb.abbr && cur.ch === c ? "on"
            : (read.has(c) ? "read" : "")}"
          title="${esc(sb.title)} ${c} · ${sb.minutes[c - 1]} min">${sb.chapters === 1
            ? esc(sb.title) : c}</button>`).join("")}</div>
    </div>
  </div>`;
}

function toggleBookPop(open) {
  const cur = hereRef();
  S.pick = S.pick || {};
  S.pick.open = open === undefined ? !S.pick.open : open;
  if (S.pick.open) { S.pick.sel = cur ? cur.abbr : "John"; S.pick.q = ""; }
  repaintHeader();
  if (S.pick.open) { const i = $("#bpq"); if (i) i.focus(); }
}
function repaintHeader() {
  const hd = $("#passagehead");
  if (hd) hd.outerHTML = passageHeadHtml();
  else paintPassage();
}

/* ============================================ comments, beside the verse
   Every note in abide is a comment on a verse. Click a verse number, a box opens in
   the margin against that line, write it and press enter - it is saved, then and
   there. Whichever method you are writing in - one box, or SOAP's four - the box opens
   beside the verse and never at the foot of the page.

   Comments written in one sitting are gathered into a single entry, so the journal
   still reads as "what I wrote on Tuesday", but each line keeps its own verse, its own
   method and its own place in the margin.

   The layout is measured rather than guessed: anchors come off the laid-out text, so a
   comment sits on its line. Anything that changes a height re-runs it - a resize, a
   webfont arriving late, a box dragged taller, a comment opening. Comments within a few
   lines of each other share a card; each is two lines tall until you open it.
*/
const MARGIN_MIN_WIDTH = 1000;      /* under this a gutter is too narrow to read in */
const CLUSTER_PX = 30;              /* anchors closer than this share a card */
let DRAFT_SEQ = 0;

function marginOn() {
  return window.innerWidth > MARGIN_MIN_WIDTH && S.reader && S.reader.passages
    && S.reader.passages.length > 0;
}
function currentKind() { return S.journalKind || st("journal_default") || "verses"; }
function methodFields(kind) {
  const k = S.boot.note_kinds[kind] || S.boot.note_kinds.verses;
  const f = (k.fields || []).filter(x => x[0] !== "summary");
  return f.length ? f : [["text", "Note", ""]];
}
function methodName(kind) { return (S.boot.note_kinds[kind] || {}).name || kind; }

function anchorEl(ref) {
  const bits = String(ref || "").split(".");
  if (bits.length < 3) {
    return $(`.scripture[data-abbr="${bits[0]}"][data-ch="${bits[1] || 1}"]`);
  }
  const v = Number(String(bits[2]).split("-")[0]);
  const scope = $$(`.scripture[data-abbr="${bits[0]}"][data-ch="${bits[1]}"] .vt`);
  return scope.find(e => Number(String(e.dataset.v).replace(/\D/g, "")) === v) || null;
}
function anchorTop(ref, base) {
  const el = anchorEl(ref);
  if (!el) return null;
  return Math.max(0, el.getBoundingClientRect().top - base);
}
function lookupVerse(abbr, ch, v) {
  for (const p of ((S.reader && S.reader.passages) || [])) {
    if (p.abbr === abbr && p.ch === ch && p.verses && p.verses[String(v)])
      return p.verses[String(v)];
  }
  return "";
}

/* ------------------------------------------------------- boxes being written */
function readDrafts() {
  $$("#margincol [data-df], #commentstack [data-df]").forEach(t => {
    const d = S.drafts.find(x => x.id === t.dataset.dd);
    if (d) d.body[t.dataset.df] = t.value;
  });
}
function focusDraft(id) {
  const t = $(`[data-dbox="${id}"] textarea`);
  if (t) { t.focus(); if (!marginOn()) t.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function addComment(ref, label, kind) {
  if (!ref) return;
  readDrafts();
  const open = S.drafts.find(d => d.ref === ref && !d.itemId);
  if (open) return focusDraft(open.id);
  const bits = String(ref).split(".");
  const v = bits[2] ? Number(String(bits[2]).split("-")[0]) : null;
  const d = { id: "d" + (++DRAFT_SEQ), ref: ref, label: label || ref,
    kind: kind || currentKind(), body: {},
    vtext: v ? lookupVerse(bits[0], Number(bits[1]), v) : "" };
  S.drafts.push(d);
  renderComments();
  focusDraft(d.id);
}
function editComment(item) {
  readDrafts();
  const open = S.drafts.find(d => d.itemId === item.id);
  if (open) return focusDraft(open.id);
  const d = { id: "e" + (++DRAFT_SEQ), itemId: item.id, ref: item.ref, label: item.label,
    kind: item.kind || "verses", body: Object.assign({}, item.body || {}), vtext: "" };
  S.drafts.push(d);
  renderComments();
  focusDraft(d.id);
}
function dropDraft(id) {
  readDrafts();
  S.drafts = S.drafts.filter(d => d.id !== id);
  renderComments();
}
async function saveDraft(id) {
  readDrafts();
  const d = S.drafts.find(x => x.id === id);
  if (!d) return;
  if (!Object.values(d.body).some(v => (v || "").trim())) return toast("nothing written yet");
  await ensureLogged();
  const r = await API("/api/comment", {
    ref: d.ref, kind: d.kind, body: d.body, item_id: d.itemId || 0,
    reading_id: (S.reader && !S.reader.finished) ? S.reader.rid : 0,
  });
  if (r.error) return toast(r.error, 4000);
  S.drafts = S.drafts.filter(x => x.id !== id);
  applyNote(r.note);                       /* on screen now, not after a round trip */
  renderComments();
  toast(d.itemId ? "changed" : "saved");
  refreshReaderMarks();                    /* ...and reconciled behind it */
}
async function removeComment(itemId) {
  const id = Number(itemId);
  const it = commentItems().find(x => x.id === id);
  S.drafts = S.drafts.filter(d => d.itemId !== id);   /* close any box editing it */
  S.marginOpen.delete("i" + id);
  dropItemLocally(id);                     /* gone from the page immediately */
  renderComments();
  await API("/api/comment/delete", { item_id: id });
  toast("removed", 6000, it ? { label: "undo", fn: async () => {
    const r = await API("/api/comment", { ref: it.ref, kind: it.kind, body: it.body,
      reading_id: (S.reader && !S.reader.finished) ? S.reader.rid : 0 });
    if (r.note) { applyNote(r.note); renderComments(); }
    refreshReaderMarks();
  } } : null);
  refreshReaderMarks();
}

/* --------------------------------------------------- keeping the page in step
   The server is the truth, but waiting for a round trip before the card appears or
   disappears makes writing feel like filing a form. So the local copy is patched first
   and the passage refetched behind it. */
/* A reconcile in flight must never undo a change made after it was asked for. Every
   local edit moves this on; a refetch only applies if nothing has happened since. */
let SYNC_SEQ = 0;

function versesOf(note, p) {
  const out = [];
  (note.items || []).forEach(i => {
    if (i.abbr === p.abbr && i.ch === p.ch && i.v1) {
      for (let v = i.v1; v <= (i.v2 || i.v1); v++) out.push(v);
    }
  });
  if (!(note.items || []).length && note.abbr === p.abbr && note.ch === p.ch && note.v1) {
    for (let v = note.v1; v <= (note.v2 || note.v1); v++) out.push(v);
  }
  return Array.from(new Set(out)).sort((x, y) => x - y);
}
function applyNote(note) {
  SYNC_SEQ++;
  if (!note || !S.reader || !S.reader.passages) return;
  S.reader.passages.forEach(p => {
    const touches = (note.items || []).some(i => i.abbr === p.abbr && i.ch === p.ch)
      || (note.abbr === p.abbr && note.ch === p.ch);
    p.notes = (p.notes || []).filter(n => n.id !== note.id);
    if (touches) p.notes.push(Object.assign({}, note, { here: versesOf(note, p) }));
  });
}
function dropItemLocally(itemId) {
  SYNC_SEQ++;
  if (!S.reader || !S.reader.passages) return;
  S.reader.passages.forEach(p => {
    (p.notes || []).forEach(n => {
      if (!n.items) return;
      n.items = n.items.filter(i => i.id !== itemId);
      n.here = versesOf(n, p);
    });
    p.notes = (p.notes || []).filter(n => (n.items || []).length || !n.items);
  });
}

/* ------------------------------------------------------------- what to draw */
function commentItems() {
  const R = S.reader; if (!R) return [];
  const out = [], seen = new Set();
  (R.passages || []).forEach(p => (p.notes || []).forEach(n => {
    if (seen.has(n.id)) return;
    seen.add(n.id);
    if (n.items && n.items.length) {
      n.items.forEach(i => out.push({ key: "i" + i.id, id: i.id, ref: i.ref,
        label: i.label, text: i.text, kind: i.kind || "verses", body: i.body || {},
        day: n.day, noteId: n.id, cardId: i.card_id }));
    } else {
      out.push({ key: "n" + n.id, id: null, ref: n.ref || "", label: n.label || "note",
        text: n.text, kind: n.kind, body: n.body || {}, day: n.day, noteId: n.id,
        cardId: n.card_id, wholeNote: true });
    }
  }));
  return out;
}

function savedLineHtml(it) {
  const open = S.marginOpen.has(it.key);
  const single = methodFields(it.kind).length === 1;
  return `<div class="mline">
    <div class="mref" data-mtoggle="${esc(it.key)}" style="cursor:pointer">
      ${esc(it.label)}
      ${single ? "" : `<span class="mkind">${esc(methodName(it.kind))}</span>`}
      <span class="x">${esc(dayName(it.day))}</span></div>
    <div class="mtext">${esc(it.text)}</div>
    ${open || it.text.length < 84 ? "" : `<div class="fade-more">more</div>`}
    <div class="macts">
      ${it.cardId ? '<span class="chip accent">kept</span>'
        : it.id ? `<button class="btn ghost sm" data-keepitem="${it.id}">keep</button>`
        : `<button class="btn ghost sm" data-keepnote="${it.noteId}">keep</button>`}
      ${it.id ? `<button class="btn ghost sm" data-editcomment="${it.id}">edit</button>
        <button class="btn ghost sm" data-delcomment="${it.id}">remove</button>`
        : `<button class="btn ghost sm" data-editnote="${it.noteId}">edit</button>
           <button class="btn ghost sm" data-delnote="${it.noteId}">remove</button>`}
    </div></div>`;
}

function draftBoxHtml(d) {
  const fields = methodFields(d.kind);
  const single = fields.length === 1;
  return `<div class="mnote draft" data-anchor="${esc(d.ref)}" data-dbox="${esc(d.id)}">
    <div class="mref">${esc(d.label)}
      <select class="mkindsel" data-dkind="${esc(d.id)}">${Object.keys(S.boot.note_kinds)
        .map(kk => `<option value="${kk}" ${kk === d.kind ? "selected" : ""}>${
          esc(S.boot.note_kinds[kk].name)}</option>`).join("")}</select>
      <span class="x" data-ddrop="${esc(d.id)}" style="cursor:pointer">×</span></div>
    ${d.vtext ? `<div class="mverse">${esc(d.vtext.slice(0, 150))}${
      d.vtext.length > 150 ? "…" : ""}</div>` : ""}
    ${fields.map(f => `${single ? "" : `<div class="mflab">${esc(f[1])}</div>`}
      <textarea data-df="${f[0]}" data-dd="${esc(d.id)}" rows="${single ? 2 : 2}"
        placeholder="${esc(single ? "What do you see here? Enter saves it."
          : (f[2] || f[1]))}">${esc(d.body[f[0]] || "")}</textarea>`).join("")}
