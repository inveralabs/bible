    <div class="macts" style="display:flex">
      <button class="btn primary sm" data-dsave="${esc(d.id)}">${d.itemId ? "Save" : "Add"}</button>
      <span class="dhint">${single ? "enter saves" : "⌘↵ saves"}</span>
    </div></div>`;
}

function renderComments() {
  const gutter = $("#margincol"), stack = $("#commentstack");
  const root = marginOn() ? gutter : stack;
  if (gutter) gutter.innerHTML = "";
  if (stack) { stack.innerHTML = ""; stack.hidden = marginOn(); }
  if (!root || !S.reader || !S.reader.passages) return;
  root.id = root.id;                                  /* keep ids as they are */
  const items = commentItems();
  const base = marginOn() && $(".readwrap")
    ? $(".readwrap").getBoundingClientRect().top : 0;
  const entries = [];
  items.forEach(it => entries.push({ kind: "saved", ref: it.ref, it: it,
    top: marginOn() ? anchorTop(it.ref, base) : null }));
  S.drafts.forEach(d => entries.push({ kind: "draft", ref: d.ref, d: d,
    top: marginOn() ? anchorTop(d.ref, base) : null }));
  if (!entries.length) {
    root.innerHTML = `<div class="margintip"${marginOn() ? "" : ' style="position:static"'}>
      <b>Click a verse number</b> and a comment box opens against that line. Press enter
      and it is saved.</div>`;
    if (marginOn()) root.style.height = "";
    return;
  }
  entries.sort((a, b) => (a.top == null ? 0 : a.top) - (b.top == null ? 0 : b.top));
  const groups = clusterItems(entries.map(e => ({ top: e.top, kind: e.kind, e: e,
    ref: e.ref })), marginOn() ? CLUSTER_PX : 0);
  const saved = items.length;
  root.innerHTML = (saved > 1 && marginOn() ? `<div class="marginhead">
      ${plural(saved, "comment")}
      <span class="spacer" style="flex:1"></span>
      <button data-marginall="${S.marginOpen.size ? "close" : "open"}">${
        S.marginOpen.size ? "collapse all" : "open all"}</button></div>` : "")
    + groups.map(g => {
      if (g.items[0].kind === "draft") return draftBoxHtml(g.items[0].e.d);
      const anyOpen = g.items.some(x => S.marginOpen.has(x.e.it.key));
      return `<div class="mnote ${anyOpen ? "open" : "collapsed"}"
        data-anchor="${esc(g.ref)}"
        data-keys="${esc(g.items.map(x => x.e.it.key).join(" "))}"
        >${g.items.map(x => savedLineHtml(x.e.it)).join("")}</div>`;
    }).join("");
  autoSizeMarginBoxes();
  if (marginOn()) layoutMargin();
  else {
    root.style.height = "";
    $$("#commentstack .mnote").forEach(el => {
      el.style.position = "static"; el.style.marginBottom = "8px"; });
    /* no gutter to line up with, but the text still says which verses carry one */
    $$(".scripture .vt.hasnote, .scripture .vt.drafting").forEach(e => {
      e.classList.remove("hasnote"); e.classList.remove("drafting"); });
    entries.forEach(en => {
      const a2 = anchorEl(en.ref);
      if (a2 && a2.classList) a2.classList.add(en.kind === "draft" ? "drafting" : "hasnote");
    });
  }
  watchMargin();
}

/* Comments whose lines are within `windowPx` of each other share a card - giving each
   one its own row is what left the gutter half empty. A box you are writing never
   shares with one already saved. Pure, so it can be checked. */
function clusterItems(items, windowPx) {
  const groups = [];
  items.forEach(i => {
    const g = groups[groups.length - 1];
    const near = g && windowPx > 0 && i.top != null && g.top != null
      && (i.top - g.top) < windowPx;
    const same = g && g.items[0].kind === i.kind && i.kind === "saved";
    if (near && same) g.items.push(i);
    else groups.push({ top: i.top == null ? 0 : i.top, items: [i], ref: i.ref });
  });
  return groups;
}

/* Each card wants to sit on its line; where that would overlap the card above, it goes
   directly underneath instead. Pure, so it can be checked. */
function stackTops(wants, heights, start, gap) {
  const out = [];
  let floor = start;
  for (let i = 0; i < wants.length; i++) {
    const top = Math.max(wants[i], floor);
    out.push(top);
    floor = top + (heights[i] || 0) + gap;
  }
  return out;
}

function autoSizeMarginBoxes() {
  $$("#commentroot textarea, #margincol textarea, #commentstack textarea").forEach(t => {
    t.style.height = "auto";
    t.style.height = Math.max(42, t.scrollHeight + 2) + "px";
  });
}

function layoutMargin() {
  const col = $("#margincol"), wrap = $(".readwrap");
  if (!col || !wrap || !marginOn()) return;
  const base = wrap.getBoundingClientRect().top;
  const boxes = $$(".mnote", col).map(el => ({
    el: el, want: anchorTop(el.dataset.anchor, base) || 0,
  }));
  boxes.sort((x, y) => x.want - y.want);
  const hd = $(".marginhead", col);
  const tops = stackTops(boxes.map(b => b.want), boxes.map(b => b.el.offsetHeight),
                         hd ? hd.offsetHeight + 6 : 0, 8);
  boxes.forEach((b, i) => { b.el.style.top = tops[i] + "px"; });
  const last = boxes.length - 1;
  col.style.height = Math.max(
    last >= 0 ? tops[last] + boxes[last].el.offsetHeight : 0, 24) + "px";
  $$(".scripture .vt.hasnote").forEach(e => e.classList.remove("hasnote"));
  $$(".scripture .vt.drafting").forEach(e => e.classList.remove("drafting"));
  boxes.forEach(b => {
    const a = anchorEl(b.el.dataset.anchor);
    if (a && a.classList) a.classList.add(b.el.classList.contains("draft")
      ? "drafting" : "hasnote");
  });
}

let MARGIN_T = null;
function relayoutMargin() {
  clearTimeout(MARGIN_T);
  MARGIN_T = setTimeout(() => { autoSizeMarginBoxes(); layoutMargin(); }, 50);
}
let RESIZE_T = null, MARGIN_RO = null;
function watchMargin() {
  /* Watch the text (it reflows) and each card (a textarea can be dragged taller).
     Deliberately not the column itself: the layout sets the column's height, so
     observing it would feed back into its own observer. */
  const body = $("#readerbody");
  if (!window.ResizeObserver) return;
  if (MARGIN_RO) MARGIN_RO.disconnect();
  MARGIN_RO = new ResizeObserver(() => relayoutMargin());
  if (body) MARGIN_RO.observe(body);
  $$("#margincol .mnote").forEach(el => MARGIN_RO.observe(el));
}
window.addEventListener("resize", () => {
  clearTimeout(RESIZE_T);
  const wide = marginOn();
  RESIZE_T = setTimeout(() => {
    readDrafts();                          /* never lose what is half-written */
    renderComments();
    if (wide !== marginOn()) paintPassage();   /* crossed the fold: swap layouts */
  }, 120);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => relayoutMargin());
}

/* ------------------------------------------------------- the passage card */
function passageHeadHtml() {
  const R = S.reader;
  if (!R) return '<div class="hd" id="passagehead"></div>';
  const isPlan = R.source === "plan";
  const nextCh = chapterAfter(1), prevCh = chapterAfter(-1);
  return `<div class="hd" id="passagehead">
      <h3>${esc(R.label)}</h3>
      <span class="chip ${isPlan ? "accent" : ""}">${isPlan ? "today's reading"
        : "you chose this"}</span>
      <span class="chip">${plural(R.verses, "verse")}</span>
      <span class="chip">${mins(R.est / 60)}</span>
      <div class="spacer"></div>
      ${chapterSwitchHtml()}
      <button class="btn ghost sm" data-act="prevch" ${prevCh ? "" : "disabled"}
        title="previous chapter">←</button>
      <button class="btn ghost sm" data-act="nextch" ${nextCh ? "" : "disabled"}
        title="next chapter">→</button>
    </div>`;
}
/* ------------------------------------------------------- the passage card */
function passageCardHtml() {
  const R = S.reader;
  if (!R) return "";
  if (!R.passages) {
    return `<div class="card"><div class="bd"><div class="empty">
      <span class="spin"></span></div></div></div>`;
  }
  const t = S.today || {};
  const isPlan = R.source === "plan";
  const nextCh = chapterAfter(1), prevCh = chapterAfter(-1);
  const mine = R.passages.reduce((a, p) => a + ((p.notes || []).length), 0);
  const hl = R.passages.reduce((a, p) => a + ((p.highlights || []).length), 0);
  return `<div class="card">${passageHeadHtml()}<div class="bd">
      <div class="readwrap">
        <div class="readcol reader" id="readerbody">
          ${R.passages.map(p => passageHtml(p, { label: R.passages.length > 1 })).join("")}
        </div>
        <div class="margincol" id="margincol"></div>
      </div>
      <div id="commentstack"></div>
      <div class="sep"></div>
      ${R.finished ? `<div class="row wrapped">
          <b class="good">Logged.</b>
          <span class="small muted">${Math.round(R.seconds / 60)} minutes on it${
            R.engaged ? "" : " - short enough that it is marked light, which is honest"}</span>
          <span class="spacer" style="flex:1"></span>
          ${isPlan && t.item ? `<button class="btn primary" data-act="nextitem">Read
            ${esc(t.item.label)} too</button>` : ""}
          ${nextCh ? `<button class="btn" data-act="nextch">On to
            ${esc(nextCh.abbr)} ${nextCh.ch}</button>` : ""}
        </div>`
      : `<div class="row wrapped">
          <button class="btn primary" data-act="finish">I have read this</button>
          <button class="btn" data-act="wholenote">A note on the whole passage</button>
          ${!isPlan && t.item ? `<button class="btn ghost" data-act="backtoplan">Back to
            today's reading</button>` : ""}
          <span class="spacer" style="flex:1"></span>
          <span class="small faint">click a verse number to write on it${mine || hl
            ? ` · ${mine} notes, ${hl} highlights here` : ""}</span>
        </div>`}
    </div></div>`;
}

function paintPassage(spin) {
  const box = $("#passagebox");
  if (!box) return renderToday();
  box.innerHTML = passageCardHtml();
  afterPassageRender();
}

/* ------------------------------------------------------- what you have here */
function yoursHereHtml() {
  const R = S.reader;
  if (!R || !R.passages) return "";
  const notes = [], hls = [];
  const seen = new Set();
  R.passages.forEach(p => {
    (p.notes || []).forEach(n => { if (!seen.has("n" + n.id)) { seen.add("n" + n.id); notes.push(n); } });
    (p.highlights || []).forEach(h => { if (!seen.has("h" + h.id)) { seen.add("h" + h.id); hls.push(h); } });
  });
  const showNotes = !marginOn();     /* on a wide screen the notes are in the gutter */
  if ((!showNotes || !notes.length) && !hls.length) return "";
  return `<div class="card"><div class="hd"><h3>Yours, here</h3>
      ${showNotes && notes.length ? `<span class="chip">${plural(notes.length, "note")}</span>` : ""}
      ${hls.length ? `<span class="chip">${plural(hls.length, "highlight")}</span>` : ""}
      <div class="spacer"></div>
      <button class="btn ghost sm" data-tab="journal">All of it</button></div>
    <div class="bd tight"><div class="notelist">
      ${showNotes ? notes.map(noteItemHtml).join("") : ""}
      ${hls.map(x => `<div class="noteitem"><div class="top">
        <span class="ref">${esc(x.label)}</span>
        <span class="chip" style="background:var(--hl-${x.color})">${esc(x.color)}</span>
        <span class="faint tiny">${esc(dayName(x.day))}</span>
        <div class="acts"><button class="btn ghost sm" data-delhl="${x.id}">remove</button></div>
      </div><div class="body">${esc(x.snippet)}</div></div>`).join("")}
    </div></div></div>`;
}

/* ------------------------------------------------------------------ today */
async function renderToday() {
  if (!S.today) loading("today");
  S.today = await API("/api/today");
  const t = S.today;
  if (t.error) { $("#view").innerHTML = `<div class="empty">${esc(t.error)}</div>`; return; }
  const w = t.week, sk = t.streak;
  const plan = t.plan && t.plan.id ? t.plan : null;
  let sub = plan
    ? esc(plan.name) + " · " + (plan.endless ? plural(plan.done, "day") + " in"
      : plan.done + " of " + plan.total + " days" + (plan.finish_estimate
        ? ` · finishes about ${dayFar(plan.finish_estimate)}, at ${plan.days_per_week} days a week` : ""))
    : "no plan running - " + `<button class="btn ghost sm" data-tab="plans">choose one</button>`;

  /* what is on screen: the plan's reading, unless you have picked something else */
  if (!S.reader && t.item && !t.item_error) {
    openPassage(t.item.refs, { source: "plan", plan_id: plan ? plan.id : 0,
      plan_seq: t.item.seq, rerender: false, quiet: true });
  } else if (!S.reader && !t.item) {
    openPassage(["John.1"], { source: "pick", rerender: false, quiet: true });
  }

  let band = "";
  if (sk.warn) {
    band = `<div class="band"><b>Two days have gone by.</b> One missed day costs
      nothing - two in a row is the one that sticks. Read something small tonight
      and the run starts again.
      ${t.rescue ? `<button class="btn sm" data-act="rescue">${esc(t.rescue.label)} · ${mins(t.rescue.minutes)}</button>` : ""}</div>`;
  } else if (t.plan_done_today && w.met) {
    band = `<div class="band good"><b>Today is done, and the week is met.</b>
      ${w.count} of 7 days - past the four the research says makes the difference.</div>`;
  } else if (t.plan_done_today) {
    band = `<div class="band good"><b>Today's reading is done.</b> ${w.count} of 7 days
      this week${w.left ? " - " + plural(w.left, "day") + " to reach " + w.target : ""}.</div>`;
  }

  let recall = "";
  if (t.recall && t.recall.reading_id && !S.recallDone) {
    const r = t.recall;
    recall = `<div class="card" id="recallcard"><div class="hd">
        <h3>First, thirty seconds</h3>
        <span class="chip">${esc(r.when)} · ${esc(r.label)}</span>
        <div class="spacer"></div>
        <button class="btn ghost sm" data-act="skiprecall">Skip</button>
      </div><div class="bd">
      <div class="small muted" style="margin-bottom:9px">Before you read today's. People
        who recalled a passage remembered 61% of it a week later; people who read it
        again remembered 40%. This is the whole trick.</div>
      <div style="font-family:var(--serif);font-size:16px;margin-bottom:10px">${esc(r.prompt)}</div>
      <textarea id="recallanswer" placeholder="Whatever comes back. Two lines is plenty."></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn primary sm" data-act="revealrecall">Show me what it was</button>
        <span class="faint tiny">nothing is marked wrong here</span>
      </div>
      <div id="recallreveal" hidden></div>
    </div></div>`;
  }

  let extras = "";
  if (t.unconfirmed && t.unconfirmed.length) {
    extras += `<div class="card"><div class="hd"><h3>Did you read these?</h3>
      <div class="spacer"></div>
      <span class="small faint">the app will not decide this for you</span>
    </div><div class="bd tight"><div class="notelist">
      ${t.unconfirmed.map(r => `<div class="noteitem"><div class="top">
        <span class="ref">${esc(r.label)}</span>
        <span class="chip">${r.minutes} min of about ${r.estimated}</span>
        <span class="faint tiny">${esc(dayName(r.day))} at ${clock(r.started_at)}</span>
      </div><div class="row" style="margin-top:8px">
        <button class="btn sm primary" data-confirm="${r.id}">Yes, I read it</button>
        <button class="btn sm" data-look="${r.id}">No, I only opened it</button>
      </div></div>`).join("")}
    </div></div></div>`;
  }
  if (t.item_error) {
    extras += `<div class="card"><div class="bd">
      <b>Today's plan reading could not be fetched.</b>
      <div class="small muted" style="margin-top:5px">${esc(t.item_error)} - this plan asks
        api.nlt.to which passages belong to today. Everything cached still works.</div>
      <div style="margin-top:10px"><button class="btn sm" data-act="retry">Try again</button></div>
    </div></div>`;
  }
  if (t.item && S.reader && S.reader.source !== "plan" && !t.plan_done_today) {
    extras += `<div class="band"><b>Today's reading is ${esc(t.item.label)}</b>
      - ${mins(t.item.minutes)}.
      <button class="btn sm" data-act="backtoplan">Open it</button></div>`;
  }
  if (t.readings && t.readings.length) {
    extras += `<div class="card"><div class="hd"><h3>Today</h3>
      <div class="spacer"></div><button class="btn ghost sm" data-tab="log">The log</button></div>
      <div class="bd tight"><div class="notelist">${t.readings.map(r => `<div class="noteitem">
        <div class="top"><span class="ref">${esc(r.label)}</span>
          <span class="chip">${clock(r.started_at)}</span>
          <span class="chip">${Math.round(r.seconds / 60)} min</span>
          ${r.finished ? countedChip(r) : '<span class="chip">still open</span>'}
          ${removeChip(r)}
          ${r.notes ? '<span class="chip">' + plural(r.notes, "note") + "</span>" : ""}
        </div></div>`).join("")}</div></div></div>`;
  }
  if (t.projects && t.projects.length) {
    extras += `<div class="card"><div class="hd"><h3>Memorising</h3>
      <div class="spacer"></div><button class="btn ghost sm" data-tab="keep">Open</button></div>
      <div class="bd tight"><div class="notelist">${t.projects.map(pr => `
        <div class="noteitem"><div class="top">
          <span class="ref">${esc(pr.name)}</span>
          <span class="chip">${pr.phase === "learning"
            ? pr.learned + " of " + pr.total + " verses"
            : pr.phase === "review" ? "day " + pr.review_day + " of " + pr.target_days
            : "kept"}</span>
          ${pr.done_today ? '<span class="chip good">done today</span>'
            : '<span class="chip warn">not yet today</span>'}
        </div></div>`).join("")}</div></div></div>`;
  }
  if (t.due_count) {
    extras += `<div class="card"><div class="bd"><div class="row">
      <div><b>${plural(t.due_count, "verse")} due</b>
      <div class="small muted" style="margin-top:2px">Scheduled for today because today
        is when you were about to forget them.</div></div>
      <div class="spacer"></div>
      <button class="btn" data-tab="keep">Review now</button></div></div></div>`;
  }

  $("#view").innerHTML = `<div class="fade">
    <div class="dayhead">
      <div><h1>${esc(dayLong(t.day))}</h1><div class="sub">${sub}</div></div>
      <div class="metrics">
        <button class="metric" data-tab="log" style="text-align:left;cursor:pointer">
          <div class="k">the log</div>
          <div class="v" style="font-size:13px;padding-top:3px">day · week · month →</div>
        </button>
        <div class="metric"><div class="k">this week</div>
          <div class="v">${w.count}<small> / 7 · target ${w.target}</small></div></div>
        <div class="metric"><div class="k">running</div>
          <div class="v">${sk.current}<small> ${sk.current === 1 ? "day" : "days"}</small></div></div>
        <div class="metric"><div class="k">today</div>
          <div class="v">${t.minutes_today}<small> min</small></div></div>
        <div class="metric"><div class="k">due to review</div>
          <div class="v">${t.due_count}</div></div>
      </div>
    </div>
    ${monthStripHtml(t.month, w)}
    ${band}${recall}
    <div id="passagebox">${passageCardHtml()}</div>
    ${yoursHereHtml()}
    ${extras}</div>`;
  afterPassageRender();
}

function refreshHere() {
  return S.tab === "keep" ? renderKeep() : renderToday();
}

function refreshReaderMarks() {
  const R = S.reader;
  if (!R || !R.refs) return;
  const mine = ++SYNC_SEQ;
  return API("/api/passages?refs=" + encodeURIComponent(R.refs.join(",")))
    .then(r => {
      if (mine !== SYNC_SEQ) return;        /* something newer has happened since */
      if (!r.passages || !S.reader) return;
      S.reader.passages = r.passages;
      const body = $("#readerbody");
      if (body) {
        body.innerHTML = r.passages.map(p =>
          passageHtml(p, { label: r.passages.length > 1 })).join("");
        renderComments();
      }
    });
}

/* ============================================= selecting verses in the text */
function verseRange(sel) {
  const a = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode
    : sel.anchorNode.parentElement);
  const b = sel.focusNode && (sel.focusNode.nodeType === 1 ? sel.focusNode
    : sel.focusNode.parentElement);
  const va = a && a.closest(".vt"), vb = b && b.closest(".vt");
  if (!va || !vb) return null;
  const scr = va.closest(".scripture");
  if (!scr || vb.closest(".scripture") !== scr) return null;
  const n1 = Number(va.dataset.v.replace(/\D/g, "")), n2 = Number(vb.dataset.v.replace(/\D/g, ""));
  if (!n1 || !n2) return null;
  return { abbr: scr.dataset.abbr, ch: Number(scr.dataset.ch),
           v1: Math.min(n1, n2), v2: Math.max(n1, n2), text: String(sel).trim(),
           scr: scr };
}
function showSelTool(r) {
  hideSelTool();
  const rect = window.getSelection().getRangeAt(0).getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "seltool"; el.id = "seltool";
  const label = r.abbr + " " + r.ch + ":" + r.v1 + (r.v2 > r.v1 ? "-" + r.v2 : "");
  el.innerHTML = S.boot.colors.map(c =>
    `<button class="sw hl-${c}" data-hl="${c}" title="highlight ${c}"></button>`).join("")
    + `<span class="vbar"></span>
      <button class="btn ghost sm" data-act="keepverse">Keep</button>
      <button class="btn ghost sm" data-act="noteverse">Note</button>
      <button class="btn ghost sm" data-act="copyverse">Copy</button>
      <span class="faint tiny" style="padding:0 4px">${esc(label)}</span>`;
  document.body.appendChild(el);
  const top = Math.max(8, rect.top - 48);
  el.style.top = top + "px";
  el.style.left = Math.max(8, Math.min(window.innerWidth - el.offsetWidth - 8,
    rect.left + rect.width / 2 - el.offsetWidth / 2)) + "px";
}
function hideSelTool() { const e = $("#seltool"); if (e) e.remove(); }
function selRefKey() {
  const s = S.sel; if (!s) return "";
  return s.abbr + "." + s.ch + "." + s.v1 + (s.v2 > s.v1 ? "-" + s.v2 : "");
}

/* ==================================================================== log
   What was read, at three altitudes. A day is the sitting. A week is the unit the
   target is set in. A month is where you can watch a book finish. */
const GRAINS = [["day", "Day"], ["week", "Week"], ["month", "Month"]];
const DOW = ["M", "T", "W", "T", "F", "S", "S"];
const mondayIndex = iso => (new Date(iso + "T12:00").getDay() + 6) % 7;
const lvlMin = m => !m ? 0 : m >= 45 ? 5 : m >= 26 ? 4 : m >= 13 ? 3 : m >= 6 ? 2 : 1;

/* ---------------------------------------------------------------- day rows */
function removeChip(r) {
  return `<button class="chip drop" data-delreading="${r.id}"
    title="take this sitting out of the log">×</button>`;
}
function countedChip(r) {
  /* the one control that lets you correct the record, wherever a sitting is shown.
     The app can infer that you read something; only you can settle it. */
  return r.engaged
    ? `<button class="chip good" data-look="${r.id}"
        title="click if you did not actually read this - it stops counting">read</button>`
    : `<button class="chip" data-confirm="${r.id}"
        title="click if you did read this - it starts counting">only opened</button>`;
}

function dayRowHtml(b, peakMinutes) {
  const dd = new Date(b.key + "T12:00");
  const sits = b.readings.slice().reverse();
  return `<div class="logday">
    <div class="chit ${b.read_count ? "met" : ""}">
      <div class="dw">${dd.toLocaleDateString(undefined, { weekday: "short" })}</div>
      <div class="dn">${dd.getDate()}</div>
    </div>
    <div>
      <div class="logwhat">${esc(b.covered) || "-"}</div>
      ${b.book_titles.length > 1
        ? `<div class="logbooks">${b.book_titles.map(esc).join(" · ")}</div>` : ""}
      <div class="logsits">
        ${sits.map(r => `<span>${clock(r.started_at)} · ${Math.round(r.seconds / 60)} min
          ${countedChip(r)}${removeChip(r)}</span>`).join("")}
        ${b.notes ? `<span>${plural(b.notes, "note")}</span>` : ""}
        ${b.cards ? `<span>${b.cards} kept</span>` : ""}
        ${b.recalls ? `<span>recalled</span>` : ""}
        ${b.reviews ? `<span>${plural(b.reviews, "review")}</span>` : ""}
      </div>
    </div>
    <div class="logmeta">
      <div class="big">${b.minutes}<small> min</small></div>
      <div class="minbar"><i style="width:${Math.min(100, 100 * b.minutes / Math.max(10, peakMinutes))}%"></i></div>
      <div class="small faint">${plural(b.chapter_count, "chapter")} · ${b.verses} verses</div>
    </div>
  </div>`;
}

/* --------------------------------------------------------------- week rows */
function weekRowHtml(b) {
  return `<div class="logweek">
    <div>
      <div style="font-weight:650;font-size:14px">${esc(b.label)}</div>
      <div class="small ${b.met ? "" : "faint"}" style="margin-top:2px;color:${
        b.met ? "var(--good)" : "var(--muted)"}">
        ${b.read_count} of 7 days${b.met ? " · target met" : " · target " + b.target}</div>
      ${b.book_titles.length
        ? `<div class="logbooks">${b.book_titles.map(esc).join(" · ")}</div>` : ""}
    </div>
    <div>
      <div class="wkstrip">${b.days.map(x => `<div class="cell ${x.future ? "future"
        : x.read ? "read" : x.light ? "light" : ""} ${x.day === (S.today && S.today.day)
        ? "today" : ""}" title="${x.day}${x.minutes ? " · " + x.minutes + " min" : ""}">
        <div>${DOW[mondayIndex(x.day)]}</div><b>${x.minutes || ""}</b></div>`).join("")}</div>
      <div class="logwhat" style="font-size:14.5px;margin-top:9px">${esc(b.covered)}</div>
    </div>
    <div class="logmeta">
      <div class="big">${b.minutes}<small> min</small></div>
      <div class="small faint">${plural(b.chapter_count, "chapter")}</div>
      <div class="small faint">${b.verses} verses</div>
      ${b.notes || b.cards ? `<div class="small faint">${b.notes} notes · ${b.cards} kept</div>` : ""}
    </div>
  </div>`;
}

/* ------------------------------------------------------- the month, as a month */
function monthBlockHtml(b) {
  const lead = mondayIndex(b.first);
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<div class="mcell blank"></div>');
  b.days.forEach(x => {
    cells.push(`<div class="mcell ${x.future ? "future" : "n" + lvlMin(x.minutes)}
      ${x.day === (S.today && S.today.day) ? "today" : ""}"
      title="${x.day}${x.minutes ? " · " + x.minutes + " min" : " · nothing"}">
      <b>${x.n}</b>${x.minutes ? `<small>${x.minutes}m</small>` : ""}</div>`);
  });
  const perWeek = b.elapsed ? (b.read_count / b.elapsed * 7) : 0;
  return `<div class="monthwrap">
    <div>
      <div class="monthgrid">${DOW.map(d => `<div class="h">${d}</div>`).join("")}
        ${cells.join("")}</div>
      <div class="logwhat" style="font-size:15px;margin-top:14px">${esc(b.covered)}</div>
      ${b.book_titles.length
        ? `<div class="logbooks">${b.book_titles.map(esc).join(" · ")}</div>` : ""}
    </div>
    <div>
      <div style="font-weight:650;font-size:16px;margin-bottom:10px">${esc(b.label)}</div>
      <div class="mstats">
        <div class="mstat"><span>days read</span>
          <b>${b.read_count}<span class="small faint"> / ${b.elapsed}</span></b></div>
        <div class="mstat"><span>that is a week of</span>
          <b class="${perWeek >= b.target * 7 / Math.max(1, b.elapsed) ? "" : ""}"
            >${perWeek.toFixed(1)}<span class="small faint"> days</span></b></div>
        <div class="mstat"><span>time</span><b>${b.minutes}<span class="small faint"> min</span></b></div>
        <div class="mstat"><span>chapters</span><b>${b.chapter_count}</b></div>
        <div class="mstat"><span>verses</span><b>${b.verses}</b></div>
        <div class="mstat"><span>notes written</span><b>${b.notes}</b></div>
        <div class="mstat"><span>verses kept</span><b>${b.cards}</b></div>
        <div class="mstat" style="border-bottom:0"><span>reviews</span><b>${b.reviews}</b></div>
      </div>
    </div>
  </div>`;
}

/* The year you are in, across the top of the Log: month labels, weekday labels, a
   square a day shaded by minutes, and the totals beside it. Compact on purpose - it is
   context for the rows underneath, not a page of its own. */
function yearStripHtml(y) {
  if (!y || !y.days) return "";
  const cols = [];
  const lead = (new Date(y.days[0].day + "T12:00").getDay() + 6) % 7;
  let placed = lead;
  for (let i = 0; i < lead; i++) (cols[0] = cols[0] || []).push(null);
  y.days.forEach(d => {
    const idx = Math.floor(placed / 7);
    (cols[idx] = cols[idx] || []).push(d);
    placed++;
  });
  let lastMonth = -1;
  const met = y.read >= Math.round(y.target * y.elapsed / 7);
  return `<div class="card"><div class="hd">
      <h3>${y.year}</h3>
      ${(y.years || []).length > 1 ? `<select id="yearpick" style="width:auto;padding:3px 6px;font-size:12px">
        ${y.years.map(yy => `<option value="${yy}" ${yy === y.year ? "selected" : ""}>${yy}</option>`).join("")}
      </select>` : ""}
      <div class="spacer"></div>
      <span class="chip ${met ? "good" : ""}">${y.read} days read</span>
      <span class="chip">${y.per_week} a week</span>
      <span class="chip">${Math.round(y.minutes / 60)} hours</span>
      ${y.light ? `<span class="chip">${y.light} only opened</span>` : ""}
      <span class="legend" style="margin-left:8px">less
        ${[0, 1, 2, 3, 4, 5].map(n => `<i style="background:var(--q${n})"></i>`).join("")}
        more</span>
    </div><div class="bd" style="padding:12px 15px">
      <div class="yearwrap">
        <div class="dowcol">${["M", "", "W", "", "F", "", "S"].map(x => `<span>${x}</span>`).join("")}</div>
        <div class="yearcols">${cols.map(col => {
          const first = col.find(Boolean);
          let lbl = "";
          if (first) {
            const m = first.month - 1;
            if (m !== lastMonth && first.n <= 7) { lbl = MONTH_SHORT[m]; lastMonth = m; }
          }
          return `<div class="ycol"><div class="mlbl">${lbl}</div>${col.map(d => d
            ? `<div class="day ${d.future ? "fut" : "n" + lvl(d.minutes, [1, 6, 13, 26, 45])}
                ${d.today ? "now" : ""}" data-tab="log"
                title="${d.day}: ${d.minutes ? d.minutes + " min" : d.future ? "" : "nothing"}"></div>`
            : `<div class="day" style="visibility:hidden"></div>`).join("")}</div>`;
        }).join("")}</div>
      </div>
    </div></div>`;
}

async function renderLog() {
  loading("what you have read");
  const g = S.log.grain;
  S.log.data = await API(`/api/history?grain=${g}&limit=${g === "day" ? 60 : 24}`
    + (S.log.year ? "&year=" + S.log.year : ""));
  const H = S.log.data;
  /* the log is about what you read. A day where a chapter was only opened sits behind
     the switch, so it is not in the middle of your week pretending to be a reading. */
  const all = H.buckets || [];
  const hidden = all.filter(b => !b.read_count).length;
  const bs = S.log.looks ? all : all.filter(b => b.read_count);
  const peak = Math.max(10, ...bs.map(b => b.minutes));
  let rows = "";
  if (g === "day") {
    let month = "";
    bs.forEach(b => {
      const m = b.key.slice(0, 7);
      if (m !== month) {
        month = m;
        const inMonth = bs.filter(x => x.key.slice(0, 7) === m);
        const dd = new Date(b.key + "T12:00");
        rows += `<div class="monthhead">${dd.toLocaleDateString(undefined,
          { month: "long", year: "numeric" })}
          <span>${plural(inMonth.length, "day")} · ${inMonth.reduce((a, x) => a + x.minutes, 0)} min
          · ${inMonth.reduce((a, x) => a + x.chapter_count, 0)} chapters</span></div>`;
      }
      rows += dayRowHtml(b, peak);
    });
  } else if (g === "week") {
    rows = bs.map(weekRowHtml).join("");
  } else {
    rows = bs.map(monthBlockHtml).join("");
  }
  const t = H.totals || {};
  const totalDays = bs.reduce((a, b) => a + b.read_count, 0);
  $("#view").innerHTML = `<div class="fade">
    <div class="dayhead"><div><h1>Log</h1>
      <div class="sub">Every sitting, with the day it happened and the clock time it
        started. Three altitudes: the sitting, the week the target lives in, and the
        month a book finishes in.</div></div>
      <div class="metrics">
        <div class="metric"><div class="k">sittings</div><div class="v">${t.readings || 0}</div></div>
        <div class="metric"><div class="k">days read</div><div class="v">${totalDays}</div></div>
        <div class="metric"><div class="k">time</div>
          <div class="v">${Math.round((t.minutes || 0) / 60)}<small> hours</small></div></div>
      </div>
    </div>
    ${yearStripHtml(H.year)}
    <div class="row" style="margin:16px 0 14px">
      <div class="seg">${GRAINS.map(([id, name]) =>
        `<button data-grain="${id}" class="${g === id ? "on" : ""}">${name}</button>`).join("")}</div>
      <label class="row small muted" style="gap:6px;cursor:pointer"
        title="days where a chapter was opened but you never said you read it">
        <input type="checkbox" id="showlooks" ${S.log.looks ? "checked" : ""}>
        also show chapters I only opened${hidden ? " (" + hidden + ")" : ""}</label>
      <span class="spacer" style="flex:1"></span>
      <span class="small faint">${g === "day" ? "the days you read, newest first"
        : g === "week" ? "Monday to Sunday · a filled cell is a day you read"
        : "a filled square is a day, darker for longer"}</span>
    </div>
    <div class="card"><div class="bd tight">${rows ||
      `<div class="empty"><b>Nothing read yet.</b>
        <div class="small" style="margin-top:6px">Read something on Today and press
        <b>I have read this</b> - it lands here with its date and the time it started.
        ${hidden ? "There " + (hidden === 1 ? "is 1 day" : "are " + hidden + " days")
          + " where a chapter was opened without you saying you read it. The switch "
          + "above shows those." : ""}</div>
      </div>`}</div></div>
  </div>`;
}

async function renderKeep() {

  if (f.abbr) qs.set("abbr", f.abbr);

    API("/api/cards/due"), API("/api/cards?limit=500"), API("/api/projects"),

async function rateCard(rating) {
  const c = S.keep.queue[S.keep.i]; if (!c) return;
  const res = await API("/api/cards/review", { id: c.id, rating: rating,
    accuracy: S.keep.result ? S.keep.result.accuracy : null });
  toast((res.due_in_words || "").replace(/^in /, "back in ").replace(/^tomorrow/, "back tomorrow"));
  S.keep.i += 1; S.keep.shown = false; S.keep.result = null;
  if (S.keep.i >= S.keep.queue.length) {
    S.today = await API("/api/today");
    renderTabs();
  }
  paintKeep();
}

/* =============================================================== progress
   Read top to bottom: where you are in the whole thing, the whole thing laid out by
   category, the year as it happened, then the two habits worth watching - the weeks
   that hit the target, and the hour you actually read at. */
function lvl(n, scale) {
  if (!n) return 0;
  for (let i = scale.length - 1; i >= 0; i--) if (n >= scale[i]) return i + 1;
  return 1;
}
/* A chapter you have read once has to be obvious at a glance, so the map does not use
   the bottom of the ramp at all: once is already bright, and more than once is brighter. */
function covLvl(n) { return !n ? 0 : n === 1 ? 3 : n === 2 ? 4 : 5; }
const MONTH_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep",
                     "Oct", "Nov", "Dec"];

function arcHtml(pct) {
  const r = 66, c = 2 * Math.PI * r;
  const on = Math.max(0, Math.min(100, pct)) / 100 * c;
  return `<div class="arc">
    <svg width="152" height="152" viewBox="0 0 152 152">
      <circle cx="76" cy="76" r="${r}" fill="none" stroke="var(--q0)" stroke-width="11"></circle>
      <circle cx="76" cy="76" r="${r}" fill="none" stroke="var(--accent)" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="${on.toFixed(1)} ${c.toFixed(1)}"></circle>
    </svg>
    <div class="mid"><b>${pct < 1 && pct > 0 ? pct.toFixed(1) : Math.round(pct)}%</b>
      <span>of the Bible</span></div>
  </div>`;
}

function testamentHtml(cov, t, title) {
  const books = cov.books.filter(b => b.testament === t);
  const done = books.filter(b => b.complete).length;
  const ch = books.reduce((a, b) => a + b.read, 0);
  const tot = books.reduce((a, b) => a + b.chapters, 0);
  const byGenre = {};
  books.forEach(b => { (byGenre[b.genre] = byGenre[b.genre] || []).push(b); });
  return `<div class="tcol">
    <div class="tcolhd"><b>${title}</b>
      <span>${ch} / ${tot} chapters · ${done} of ${books.length} books</span></div>
    ${GENRE_ORDER.filter(g => byGenre[g]).map(g => {
      const gb = byGenre[g];
      const gr = gb.reduce((a, b) => a + b.read, 0), gt = gb.reduce((a, b) => a + b.chapters, 0);
      return `<div class="gengroup">
        <div class="genhd"><i>${esc(GENRE_SHORT[g] || g)}</i>
          <span class="gbar"><u style="width:${gt ? 100 * gr / gt : 0}%"></u></span>
          <em>${gr}/${gt}</em></div>
        ${gb.map(b => `<div class="bookrow">
          <div class="nm ${b.complete ? "done" : ""}" title="${esc(b.title)}">${esc(b.title)}</div>
          <div class="cells">${b.cells.map((n, i) => `<div class="cell n${covLvl(n)}
            ${b.partial[i] ? "part" : ""}" data-when="${b.abbr}.${i + 1}" data-times="${n}"
            title="${esc(b.title)} ${i + 1}${n ? " · read " + plural(n, "time") : " · not yet"}"
            ></div>`).join("")}</div>
        </div>`).join("")}
      </div>`;
    }).join("")}
  </div>`;
}

function hideWhen() { const e = $("#whenpop"); if (e) e.remove(); }
function showWhen(cell, key, times) {
  hideWhen();
  const known = (S.progress || {}).chapter_days;
  const days = (known || {})[key] || [];
  const n = Number(times) || days.length;
  const bits = key.split(".");
  const bk = S.boot.books.find(x => x.abbr === bits[0]);
  const label = (bk ? bk.title : bits[0]) + " " + bits[1];
  const el = document.createElement("div");

/* ================================================================== plans */
/* --------------------------------------------- build one: "John in 10 days"
   Pick what to read and say how you want to measure it - a number of days, a number
   of chapters, or a number of minutes. The other two are worked out from the real word
   count and shown before you commit to anything. */
const BUILD_UNITS = { days: 1, weeks: 7, months: 30 };

function buildTarget() {
  const what = ($("#bwhat") || {}).value || "John";
  const sets = (S.boot.book_sets || {});
  const abbrs = what.startsWith("set:") ? (sets[what.slice(4)] || {}).books || [] : [what];
  let chapters = 0, minutes = 0;
  abbrs.forEach(a => {
    const b = S.boot.books.find(x => x.abbr === a);
    if (!b) return;
    chapters += b.chapters;
    minutes += b.minutes.reduce((x, y) => x + y, 0);
  });
  const title = what.startsWith("set:") ? (sets[what.slice(4)] || {}).title || what
    : (S.boot.books.find(x => x.abbr === what) || {}).title || what;
  return { what: what, abbrs: abbrs, chapters: chapters, minutes: minutes, title: title };
}

function buildPace() {
  const how = ($("#bhow") || {}).value || "in_days";
  const n = Math.max(1, Number(($("#bnum") || {}).value) || 1);
  const unit = ($("#bunit") || {}).value || "days";
  if (how === "in_days") return { in_days: Math.round(n * (BUILD_UNITS[unit] || 1)) };
  if (how === "minutes") return { minutes: n };
  return { per_day: n };
}

function buildPreview() {
  const t = buildTarget(), pace = buildPace();
  if (!t.chapters) return "";
  let days;
  if (pace.in_days) days = Math.min(pace.in_days, t.chapters);
  else if (pace.minutes) days = Math.max(1, Math.ceil(t.minutes / pace.minutes));
  else days = Math.ceil(t.chapters / pace.per_day);
  const perDay = t.chapters / days, minDay = t.minutes / days;
  const rate = (Number(st("target_days")) || 4) / 7;
  const finish = new Date();
  finish.setDate(finish.getDate() + Math.ceil(days / rate));
  return `<b>${esc(t.title)}</b> is ${t.chapters} chapters, about
    ${Math.round(t.minutes)} minutes of reading in all. At this pace that is
    <b>${days} ${days === 1 ? "day" : "days"}</b> of
    ${perDay < 1.05 ? "a chapter" : (Math.round(perDay * 10) / 10) + " chapters"}
    (about ${Math.round(minDay)} min) each - and reading ${st("target_days")} days a
    week, it finishes about ${dayFar(finish.toISOString().slice(0, 10))}.`;
}

function paintPreview() {
  const el = $("#bpreview");
  if (el) el.innerHTML = buildPreview();
  const unit = $("#bunit");
  if (unit) unit.style.display = ($("#bhow") || {}).value === "in_days" ? "" : "none";
  const lab = $("#blabel");
  if (lab) lab.textContent = ($("#bhow") || {}).value === "in_days" ? "in" : "at";
}

function openModal(title, bodyHtml, footHtml, onMount) {
  closeModal();
  const el = document.createElement("div");
  el.className = "scrim"; el.id = "scrim";
  el.innerHTML = `<div class="modal ${title.wide ? "wide" : ""}" role="dialog">
      <div class="hd"><h3>${esc(title.text || title)}</h3><div class="spacer"></div>
        <button class="iconb" data-act="closemodal">✕</button></div>
      <div class="bd">${bodyHtml}</div>
      ${footHtml ? `<div class="ft">${footHtml}</div>` : ""}
    </div>`;
  document.body.appendChild(el);
  el.addEventListener("click", e => { if (e.target === el) closeModal(); });
  if (onMount) onMount(el);
  const first = el.querySelector("input,textarea,select");
  if (first) first.focus();
}
function closeModal() { const e = $("#scrim"); if (e) e.remove(); }

     <button class="btn primary" data-startplan="${t.id}">Start it</button>`,
    el => {
      const mode = $("#pmode", el);
      const box = $("#pvalue", el);
      const paint = () => {
        const m = mode.value;
        box.innerHTML = m === "per_day"
          ? `<label class="field"><span>Chapters a day</span>
              <input type="number" id="pn" min="1" max="20" value="${t.pace.per_day || 1}"></label>`
          : m === "minutes"
          ? `<label class="field"><span>Minutes a day</span>
              <em>abide sizes each day from the real word count of the chapters.</em>
              <input type="number" id="pn" min="3" max="90" value="${t.pace.minutes || 12}"></label>`
          : `<label class="field"><span>Finish by</span>
              <input type="text" id="pn" placeholder="2027-12-31"></label>`;
      };
      if (mode) { mode.addEventListener("change", paint); paint(); }
    });
}

function paceModal(pid) {
  const p = (S.plans.mine || []).find(x => x.id === pid);
  if (!p) return;
  openModal({ text: "Change the pace of " + p.name }, `
    <p class="small muted" style="margin-top:0">The days you have already read stay
      exactly as they are. Everything after today is rebuilt at the new pace.</p>
    <label class="field"><span>How much a day</span>
      <select id="pmode2"><option value="per_day">chapters a day</option>
        <option value="minutes">minutes a day</option></select></label>
    <label class="field"><span>How many</span>
      <input type="number" id="pn2" min="1" max="90" value="${(p.spec && p.spec.pace
        && (p.spec.pace.per_day || p.spec.pace.minutes)) || 2}"></label>`,
    `<span class="spacer"></span><button class="btn" data-act="closemodal">Cancel</button>
     <button class="btn primary" data-savepace="${pid}">Save</button>`);
}

function projectModal() {
  openModal({ text: "Memorise a passage" }, `
    <p class="small muted" style="margin-top:0">A verse a day, ten times aloud, added to
      everything before it. When the passage is finished you say the whole thing once a
      day for a hundred days. Pick something you want for life.</p>
    <label class="field"><span>What</span>
      <em>A chapter, a few verses, or a whole short book. "Rom 8", "Ps 23",
        "Phil 2:1-11", "James".</em>
      <input type="text" id="prref" placeholder="Rom 8"></label>
    <label class="field"><span>Days of review once it is learned</span>
      <input type="number" id="prdays" value="100" min="7" max="365"></label>`,
    `<span class="spacer"></span><button class="btn" data-act="closemodal">Cancel</button>
     <button class="btn primary" data-act="saveproject">Start</button>`);
}

function cardModal() {
  openModal({ text: "Keep something" }, `
    <label class="field"><span>Kind</span>
      <select id="ckind">
        <option value="verse">a verse - reference on the front, words on the back</option>
        <option value="firstletter">a verse, first letters as the cue</option>
        <option value="fact">something of my own</option>
      </select></label>
    <label class="field" id="crefwrap"><span>Reference</span>
      <input type="text" id="cref" placeholder="Rom 8:28"></label>
    <div id="cfree" hidden>
      <label class="field"><span>Front</span><textarea id="cfront" rows="2"></textarea></label>
      <label class="field"><span>Back</span><textarea id="cback" rows="3"></textarea></label>
    </div>`,
    `<span class="spacer"></span><button class="btn" data-act="closemodal">Cancel</button>
     <button class="btn primary" data-act="savecard">Keep it</button>`,
    el => {
      const k = $("#ckind", el);
      k.addEventListener("change", () => {
        const free = k.value === "fact";
        $("#crefwrap", el).hidden = free;
        $("#cfree", el).hidden = !free;

function noteModal(n) {
  const kinds = S.boot.note_kinds;
  if (n.items && n.items.length) {
    openModal({ text: (n.label || "A note") + " - verse by verse", wide: true },
      `<div class="vnotes">${n.items.map(i => `<div class="vnote">
          <div class="vlab">${esc(i.label)}</div>
          <div class="vbody"><textarea data-eitem="${esc(i.ref)}" rows="2">${esc(i.text)}</textarea></div>
        </div>`).join("")}</div>
      <div class="sep"></div>
      <label class="field"><span>On the passage as a whole</span>
        <textarea data-esum rows="2">${esc((n.body || {}).summary || "")}</textarea></label>
      <div class="small faint">Empty a line to remove that verse from the note.</div>`,
      `<span class="spacer"></span><button class="btn" data-act="closemodal">Cancel</button>
       <button class="btn primary" data-saveitems="${n.id}">Save</button>`);
    return;
  }
  const k = kinds[n.kind] || kinds.plain;
  openModal({ text: (n.label || "A note") + " - " + k.name },

      <textarea data-ef="${f[0]}" rows="3">${esc((n.body || {})[f[0]] || "")}</textarea></label>`).join(""),
    `<span class="spacer"></span><button class="btn" data-act="closemodal">Cancel</button>
     <button class="btn primary" data-saveedit="${n.id}">Save</button>`);
}

/* ================================================================ search */
/* Is what you typed a reference or a search? The server decides - it has the alias
   table that knows "psalm 23", "ii cor 5", "1 jn 4.8" and "song of solomon 2". */
async function matchBook(text) {
  const r = await API("/api/parse?ref=" + encodeURIComponent(text));
  return (r && r.abbr) ? { abbr: r.abbr, ch: r.ch || 1, v: r.v || null } : null;
}

async function doSearch(text) {
  const jump = await matchBook(text);
  if (jump) {
    closeModal();
    S.jumpVerse = jump.v;
    if (S.tab !== "today") await go("today");
    return openPassage([jump.abbr + "." + jump.ch], { source: "pick" });
  }
  openModal({ text: 'Searching for "' + text + '"', wide: true },
    `<div class="empty"><span class="spin"></span></div>`);
  const r = await API("/api/search?where=both&q=" + encodeURIComponent(text));
  const mine = r.mine || {};
  const bible = r.bible || [];
  const box = $("#scrim .bd");
  if (!box) return;
  box.innerHTML = `
    ${mine.notes && mine.notes.length ? `<h4 style="margin-bottom:8px">Your notes</h4>
      <div class="notelist" style="margin-bottom:16px">${mine.notes.slice(0, 8).map(noteItemHtml).join("")}</div>` : ""}
    ${mine.cards && mine.cards.length ? `<h4 style="margin-bottom:8px">Kept</h4>
      <div class="notelist" style="margin-bottom:16px">${mine.cards.slice(0, 6).map(c =>
        `<div class="noteitem"><div class="top"><span class="ref">${esc(c.label)}</span></div>
        <div class="body">${esc((c.back || "").slice(0, 160))}</div></div>`).join("")}</div>` : ""}
    <h4 style="margin-bottom:8px">In the ${esc(st("version"))}
      ${bible.length && bible[0].total ? `<span class="faint small">${bible[0].total} results</span>` : ""}</h4>
    ${r.bible_error ? `<div class="small muted">${esc(r.bible_error)}</div>` : ""}
    <div class="notelist">${bible.map(b => `<div class="noteitem">
      <div class="top"><span class="ref">${esc(b.label)}</span>
        <div class="acts"><button class="btn ghost sm" data-goto="${esc(b.ref)}">open</button></div></div>
      <div class="body" style="font-family:var(--serif);font-size:14.5px">${b.snippet}</div>
    </div>`).join("") || '<div class="empty">nothing</div>'}`;
}

/* ================================================================= events */
document.addEventListener("click", async (e) => {
  const collapsed = e.target.closest(".mnote.collapsed");
  if (collapsed && !e.target.closest("button,select,textarea,[data-mtoggle],[data-ddrop]")) {
    (collapsed.dataset.keys || "").split(" ").filter(Boolean)
      .forEach(x => S.marginOpen.add(x));
    return renderComments();
  }
  const vn = e.target.closest(".scripture .vn");
  if (vn) {                                  /* a verse number is a place to write */
    const vt = vn.closest(".vt"), scr = vn.closest(".scripture");
    if (vt && scr) {
      const v = Number(String(vt.dataset.v).replace(/\D/g, ""));
      const abbr = scr.dataset.abbr, ch = Number(scr.dataset.ch);
      const r = await API("/api/parse?ref=" + encodeURIComponent(abbr + "." + ch + "." + v));
      addComment(abbr + "." + ch + "." + v, r.label || (abbr + " " + ch + ":" + v));
    }
    return;
  }
  const t = e.target.closest("[data-tab],[data-act],[data-book],[data-ch],[data-hl],"
    + "[data-rate],[data-tpl],[data-startplan],[data-activate],[data-delplan],[data-pace],"
    + "[data-savepace],[data-advance],[data-archive],[data-showproj],[data-delcard],"
    + "[data-delnote],[data-editnote],[data-keepnote],[data-saveedit],[data-delhl],"
    + "[data-delreading],[data-goto],[data-recallgrade],[data-dsave],[data-ddrop],"
    + "[data-editcomment],[data-delcomment],"
    + "[data-vdrop],[data-keepitem],[data-grain],"
    + "[data-saveitems],[data-confirm],[data-look],[data-mtoggle],[data-marginall],"
    + "[data-bp],[data-bpch],[data-kpane],[data-when]");
  if (!t) {
    if (!e.target.closest(".seltool")) hideSelTool();
    if (!e.target.closest("#whenpop")) hideWhen();
    if (S.pick && S.pick.open && !e.target.closest("#bookpop")) toggleBookPop(false);
    return;
  }
  const d = t.dataset;

  if (d.tab) { closeModal(); return go(d.tab); }
  if (d.goto) {
    closeModal(); hideWhen();
    const bits = d.goto.split(".");
    S.jumpVerse = bits[2] ? Number(String(bits[2]).split("-")[0]) : null;
    if (S.tab !== "today") await go("today");
    return openPassage([bits[0] + "." + (bits[1] || 1)], { source: "pick" });
  }
  if (d.dsave) return saveDraft(d.dsave);
  if (d.ddrop) return dropDraft(d.ddrop);
  if (d.editcomment) {
    const it = commentItems().find(x => x.id === Number(d.editcomment));
    if (it) editComment(it);
    return;
  }
  if (d.delcomment) return removeComment(d.delcomment);
  if (d.keepitem) {
    const r = await API("/api/note/keep", { item_id: Number(d.keepitem) });
    if (r.card_id) toast("that line comes back tomorrow");
    return refreshHere();
  }
  if (d.grain) { S.log.grain = d.grain; return renderLog(); }
  if (d.kpane) { S.keep.pane = d.kpane; return paintKeep(); }
  if (d.when) { return showWhen(t, d.when, t.dataset.times); }
  if (d.bp) {                                  /* a book: show its chapters below */
    S.pick = Object.assign({}, S.pick, { sel: d.bp, open: true });
    const sb = S.boot.books.find(x => x.abbr === d.bp);
    if (sb && sb.chapters === 1) { S.pick.open = false; repaintHeader();
      return openPassage([d.bp + ".1"], { source: "pick" }); }
    repaintHeader();
    const i2 = $("#bpq"); if (i2) i2.focus();
    return;
  }
  if (d.bpch) {                                /* a chapter: open it and close up */
    S.pick = Object.assign({}, S.pick, { open: false });
    const bits = d.bpch.split(".");
    return openPassage([bits[0] + "." + bits[1]], { source: "pick" });
  }
  if (d.mtoggle) {
    if (S.marginOpen.has(d.mtoggle)) S.marginOpen.delete(d.mtoggle);
    else S.marginOpen.add(d.mtoggle);
    return renderComments();
  }
  if (d.marginall) {
    if (d.marginall === "close") S.marginOpen.clear();
    else commentItems().forEach(i => S.marginOpen.add(i.key));
    return renderComments();
  }
  if (d.confirm || d.look) {
    const yes = d.confirm ? 1 : 0;
    await API("/api/reading/confirm", { id: Number(d.confirm || d.look), yes: yes });
    toast(yes ? "marked as read - it counts now"
      : "marked as only opened - it no longer counts");
    S.today = null;
    return S.tab === "log" ? renderLog()
      : S.tab === "progress" ? renderProgress() : renderToday();
  }
  if (d.hl) {
    if (!S.sel) return;
    await API("/api/highlight", { ref: selRefKey(), color: d.hl,
      snippet: (S.sel.text || "").slice(0, 500) });
    hideSelTool(); window.getSelection().removeAllRanges();
    await ensureLogged();
    toast("highlighted");
    refreshReaderMarks();
    return;
  }
  if (d.rate) return rateCard(Number(d.rate));
  if (d.tpl) return planModal(d.tpl);
  if (d.startplan) {
    const tpl = (S.plans.templates || []).find(x => x.id === d.startplan);
    const spec = { name: $("#pname") ? $("#pname").value : tpl.name };
    const mode = $("#pmode") ? $("#pmode").value : "";
    const val = $("#pn") ? $("#pn").value : "";
    if (tpl.kind === "list") {
      if (tpl.set) spec.set = tpl.set;
      else spec.books = [$("#pbook").value];
    }
    if (tpl.kind === "tracks") spec.tracks = tpl.tracks;
    if (tpl.kind === "dated") spec.rule = tpl.rule;
    if (tpl.kind === "api") spec.api_plan = tpl.api_plan;
    spec.pace = mode === "minutes" ? { minutes: Number(val) || 12 }
      : mode === "finish_by" ? { finish_by: val }
      : mode === "per_day" ? { per_day: Number(val) || 1 } : Object.assign({}, tpl.pace);
    closeModal();
    loading("building the list");
    const r = await API("/api/plan/create",
      { kind: tpl.kind, spec: spec, name: spec.name });
    if (r.error) { toast(r.error, 5000); return go("plans"); }
    toast("started");
    S.today = null;
    return go("today");
  }
  if (d.activate) { await API("/api/plan/activate", { id: Number(d.activate) });
    S.today = null; return go("plans"); }
  if (d.delplan) {
    await API("/api/plan/delete", { id: Number(d.delplan) });
    toast("plan removed - your readings and notes stay");
    return go("plans");
  }
  if (d.pace) return paceModal(Number(d.pace));
  if (d.savepace) {
    const m = $("#pmode2").value, n = Number($("#pn2").value) || 1;
    closeModal();
    await API("/api/plan/pace", { plan_id: Number(d.savepace),
      pace: m === "minutes" ? { minutes: n } : { per_day: n } });
    S.today = null; toast("rebuilt from tomorrow on"); return go("plans");
  }
  if (d.advance) {
    await API("/api/project/advance", { id: Number(d.advance), added: 1 });
    return renderKeep();
  }
  if (d.archive) { await API("/api/project/archive", { id: Number(d.archive), archive: 1 });
    return renderKeep(); }
  if (d.showproj) { const b = $("#proj" + d.showproj); if (b) b.hidden = !b.hidden; return; }
  if (d.delcard) {
    await API("/api/card/delete", { id: Number(d.delcard) }); return renderKeep();
  }
  if (d.delnote) {
    await API("/api/note/delete", { id: Number(d.delnote) });
    toast("removed");
    return refreshHere();
  }
  if (d.editnote) {
    const pool = (S.journal.notes || []).concat(
      ...((S.reader && S.reader.passages) || []).map(p => p.notes || []));
    const n = pool.find(x => x.id === Number(d.editnote));
    if (n) noteModal(n);
    return;
  }
  if (d.saveitems) {
    const items = $$("#scrim [data-eitem]").map(x =>
      ({ ref: x.dataset.eitem, text: x.value })).filter(x => x.text.trim());
    const sum = $("#scrim [data-esum]");
    await API("/api/note", { note_id: Number(d.saveitems), kind: "verses",
      body: { summary: sum ? sum.value : "" }, items: items });
    closeModal(); toast("saved");
    return refreshHere();
  }
  if (d.saveedit) {
    const body = {};
    $$("#scrim [data-ef]").forEach(x => { body[x.dataset.ef] = x.value; });
    const n = (S.journal.notes || []).find(x => x.id === Number(d.saveedit));
    await API("/api/note", { note_id: Number(d.saveedit), kind: n ? n.kind : "plain",
      body: body });
    closeModal(); toast("saved");
    return refreshHere();
  }
  if (d.keepnote) {
    const r = await API("/api/note/keep", { id: Number(d.keepnote) });
    if (r.card_id) toast("it will come back tomorrow");
    return refreshHere();
  }
  if (d.delhl) {
    await API("/api/highlight/delete", { id: Number(d.delhl) });
    return refreshHere();
  }
  if (d.delreading) {
    await API("/api/reading/delete", { id: Number(d.delreading) });
    toast("taken out of the log");
    S.today = null;
    return S.tab === "log" ? renderLog()
      : S.tab === "progress" ? renderProgress() : renderToday();
  }
  if (d.recallgrade !== undefined && t.hasAttribute("data-recallgrade")) {
    const r = S.today.recall;
    await API("/api/recall", { reading_id: r.reading_id,
      answer: ($("#recallanswer") || {}).value || "", grade: Number(d.recallgrade) });
    S.recallDone = true;
    const c = $("#recallcard"); if (c) c.remove();
    toast("that counts as a reading of it too");
    return;
  }

  switch (d.act) {
    case "closemodal": return closeModal();
    case "backtoplan": case "nextitem": {
      const i = S.today.item;
      if (!i) return;
      return openPassage(i.refs, { source: "plan",
        plan_id: S.today.plan ? S.today.plan.id : 0, plan_seq: i.seq });
    }
    case "rescue": return openPassage([S.today.rescue.ref], { source: "pick" });
    case "finish": return finishReading();

    case "notepanel": {
      const p = $("#notepanel");
      if (p) { p.scrollIntoView({ behavior: "smooth", block: "start" });
        const f = $("textarea", p); if (f) f.focus(); }
      return;
    }
    case "skiprecall": {
      S.recallDone = true;
      const c = $("#recallcard"); if (c) c.remove();
      return;
    }
    case "revealrecall": {
      const r = S.today.recall;
      const box = $("#recallreveal");
      box.hidden = false;
      box.innerHTML = `<div class="sep"></div>
        ${r.notes && r.notes.length ? `<div class="small muted">What you wrote then</div>
          <div class="notelist" style="margin:6px 0 12px">${r.notes.map(noteItemHtml).join("")}</div>` : ""}
        <div class="small muted">How it opens</div>
        <div style="font-family:var(--serif);font-size:16px;line-height:1.7;margin:6px 0 12px;
          max-width:var(--measure)">${esc(r.first_lines)}…</div>
        <div class="row wrapped">
          <span class="small muted">How much came back?</span>
          <button class="btn sm" data-recallgrade="0">Nothing</button>
          <button class="btn sm" data-recallgrade="1">Some of it</button>
          <button class="btn sm primary" data-recallgrade="2">Most of it</button>
          <button class="btn ghost sm" data-goto="${esc((r.refs || [])[0] || "")}">Read it again</button>
        </div>`;
      return;
    }
    case "retry": {
      if (S.reader && S.reader.refs) {
        const R = S.reader;
        return openPassage(R.refs, { source: R.source, plan_id: R.plan_id,
          plan_seq: R.plan_seq });
      }
      return go(S.tab);
    }
    case "show": { S.keep.shown = true; return paintKeep(); }
    case "checkrecite": {
      const c = S.keep.queue[S.keep.i];
      const typed = ($("#recitebox") || {}).value || "";
      S.keep.result = await API("/api/cards/recite", { id: c.id, typed: typed });
      S.keep.shown = true;
      return paintKeep();
    }
    case "skipcard": { S.keep.i += 1; S.keep.shown = false; S.keep.result = null; return paintKeep(); }
    case "suspend": {
      const c = S.keep.queue[S.keep.i];
      await API("/api/card/suspend", { id: c.id, suspended: 1 });
      S.keep.i += 1; S.keep.shown = false; return paintKeep();
    }
    case "buildplan": {
      const t = buildTarget(), pace = buildPace();
      if (!t.chapters) return toast("pick something to read");
      const spec = { pace: pace, name: t.title };
      if (t.what.startsWith("set:")) spec.set = t.what.slice(4);
      else spec.books = [t.what];
      loading("building the list");
      const r = await API("/api/plan/create",
        { kind: "list", spec: spec, name: t.title });
      if (r.error) { toast(r.error, 5000); return go("plans"); }
      toast(t.title + " - " + r.plan.total + " days");
      S.today = null; S.reader = null;
      return go("today");
    }
    case "newproject": return projectModal();
    case "saveproject": {
      const r = await API("/api/project/create", { ref: $("#prref").value,
        target_days: Number($("#prdays").value) || 100 });
      if (r.error) return toast(r.error, 4000);
      closeModal(); return renderKeep();
    }
    case "newcard": return cardModal();
    case "savecard": {
      const kind = $("#ckind").value;
      const payload = kind === "fact"
        ? { kind: kind, front: $("#cfront").value, back: $("#cback").value }
        : { kind: kind, ref: $("#cref").value };
      const r = await API("/api/card", payload);
      if (r.error) return toast(r.error, 4000);
      closeModal(); toast("kept"); return renderKeep();
    }

    case "notethis": {
      const p = $("#notepanel");
      if (p) { p.scrollIntoView({ behavior: "smooth", block: "start" });
        const f = $("textarea", p) || $("#vadd"); if (f) f.focus(); }
      return;
    }
    case "projectthis": {
      const p = ((S.reader && S.reader.passages) || [])[0];
      projectModal();
      if (p) setTimeout(() => { const i = $("#prref"); if (i) i.value = p.label; }, 30);
      return;
    }
    case "bookpop": return toggleBookPop();
    case "bookpopclose": return toggleBookPop(false);
    case "prevch": case "nextch": {
      const n = chapterAfter(d.act === "nextch" ? 1 : -1);
      if (!n) return;
      return openPassage([n.abbr + "." + n.ch], { source: "pick" });
    }
    case "keepverse": {
      if (!S.sel) return;
      await ensureLogged();
      const r = await API("/api/card", { kind: "verse", ref: selRefKey(),
        reading_id: (S.reader && !S.reader.finished) ? S.reader.rid : 0 });
      hideSelTool(); window.getSelection().removeAllRanges();
      if (r.id) toast("kept - it comes back tomorrow, then when you need it");
      refreshReaderMarks();
      return;
    }
    case "noteverse": {
      if (!S.sel) return;
      const key = selRefKey(), label = S.sel.abbr + " " + S.sel.ch + ":" + S.sel.v1
        + (S.sel.v2 > S.sel.v1 ? "-" + S.sel.v2 : "");
      hideSelTool();
      window.getSelection().removeAllRanges();
      S.noteRef = key; S.noteRefLabel = label;
      const kinds = S.boot.note_kinds;
      const cur = S.journalKind || st("journal_default") || "verses";
      const r = await API("/api/parse?ref=" + encodeURIComponent(key));
      addComment(key, r.label || label);
      return;
    }
    case "wholenote": {
      const p = ((S.reader && S.reader.passages) || [])[0];
      if (!p) return;
      return addComment(p.abbr + "." + p.ch, p.label);
    }
    case "copyverse": {
      if (!S.sel) return;
      const label = S.sel.abbr + " " + S.sel.ch + ":" + S.sel.v1
        + (S.sel.v2 > S.sel.v1 ? "-" + S.sel.v2 : "");
      try { await navigator.clipboard.writeText(S.sel.text + "\n" + label + " (" + st("version") + ")");
        toast("copied"); } catch (err) { toast("could not reach the clipboard"); }
      hideSelTool(); return;
    }
  }
});

/* selection, footnotes, scroll depth, keys */
document.addEventListener("mouseup", () => {
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !String(sel).trim()) { hideSelTool(); S.sel = null; return; }
    const r = verseRange(sel);
    if (!r) { hideSelTool(); S.sel = null; return; }
    S.sel = r; showSelTool(r);
  }, 10);
});
document.addEventListener("mouseover", e => {
  const mn = e.target.closest(".mnote");
  $$(".scripture .vt.anchor").forEach(x => x.classList.remove("anchor"));
  if (mn) {
    const a = anchorEl(mn.dataset.anchor);
    if (a && a.classList) a.classList.add("anchor");
  }
  const fn = e.target.closest(".fn");
  const old = $(".fntip"); if (old) old.remove();
  if (!fn || !fn.dataset.fn) return;
  const tip = document.createElement("div");
  tip.className = "fntip"; tip.textContent = fn.dataset.fn;
  document.body.appendChild(tip);
  const r = fn.getBoundingClientRect();
  tip.style.top = (r.bottom + 8) + "px";
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8,
    r.left - tip.offsetWidth / 2)) + "px";
});
document.addEventListener("mouseout", e => {
  if (e.target.closest && e.target.closest(".fn")) { const t = $(".fntip"); if (t) t.remove(); }
});
window.addEventListener("scroll", () => {
  const R = S.reader; if (!R || R.finished) return;
  const body = $("#readerbody"); if (!body) return;
  const rect = body.getBoundingClientRect();
  const seen = Math.min(1, Math.max(0, (window.innerHeight - rect.top) / Math.max(1, rect.height)));
  R.scroll = Math.max(R.scroll, Math.round(seen * 100));
}, { passive: true });
document.addEventListener("visibilitychange", () => {
  const R = S.reader;
  if (R && !R.finished && document.visibilityState === "hidden")
    API("/api/reading/touch", { id: R.rid, seconds: R.seconds, scroll: R.scroll });
});
window.addEventListener("beforeunload", () => {
  const R = S.reader;
  if (R && !R.finished && navigator.sendBeacon)
    navigator.sendBeacon("/api/reading/touch",
      new Blob([JSON.stringify({ id: R.rid, seconds: R.seconds, scroll: R.scroll })],
        { type: "application/json" }));
});

document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || e.target.isContentEditable;
  if (e.key === "Escape") {
    if ($("#whenpop")) { hideWhen(); return; }
    if (S.pick && S.pick.open) { toggleBookPop(false); return; }
    closeModal(); hideSelTool();
    if (typing) e.target.blur();
    return;
  }
  if (typing) {
    /* a comment box: enter saves a single-field one, cmd-enter saves any of them */
    const box = e.target.closest && e.target.closest("[data-dbox]");
    if (box && e.key === "Enter") {
      const d = S.drafts.find(x => x.id === box.dataset.dbox);
      const single = d && methodFields(d.kind).length === 1;
      if ((single && !e.shiftKey) || e.metaKey || e.ctrlKey) {
        e.preventDefault();
        return saveDraft(box.dataset.dbox);
      }
    }
    if (box && e.key === "Escape") { e.preventDefault(); return dropDraft(box.dataset.dbox); }
    if (e.key === "Enter" && e.target.id === "q") {
      const v = e.target.value.trim(); if (v) doSearch(v);
    }
    if (e.key === "Enter" && e.target.id === "bpq") {
      const v = e.target.value.trim();
      const one = $("#bookpop .bpbook");
      if (!v) return;
      API("/api/parse?ref=" + encodeURIComponent(v)).then(r => {
        if (r.first) {
          toggleBookPop(false);
          openPassage(r.refs.slice(0, 6), { source: "pick" });
        } else if (one) one.click();
      });
      return;
    }
    if (e.key === "Enter" && e.target.id === "vadd") {
      e.preventDefault();
      const b = $("[data-act=addverse]"); if (b) b.click();
    }
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      const b = $("#scrim .btn.primary") || $("#notepanel [data-act=savenote]");
      if (b) b.click();
    }
    return;
  }
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); return; }
  if (S.tab === "keep" && S.keep.queue[S.keep.i]) {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (!S.keep.shown) { S.keep.shown = true; paintKeep(); }
      return;
    }
    if ("1234".includes(e.key) && S.keep.shown) { e.preventDefault(); return rateCard(Number(e.key)); }
  }
  if (S.tab === "today" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    const n = chapterAfter(e.key === "ArrowRight" ? 1 : -1);
    if (n) { e.preventDefault(); return openPassage([n.abbr + "." + n.ch], { source: "pick" }); }
  }
  if (e.key.toLowerCase() === "b" && S.tab === "today") {
    e.preventDefault();
    return toggleBookPop();
  }
  const jump = { t: "today", l: "log", k: "keep", j: "journal",
                 p: "progress", s: "settings" }[e.key.toLowerCase()];
  if (jump && !e.metaKey && !e.ctrlKey && !e.altKey) go(jump);
});

document.addEventListener("input", e => {
  if (e.target && e.target.id === "bpq") {
    S.pick = Object.assign({}, S.pick, { q: e.target.value, open: true });
    const at = e.target.selectionStart;
    repaintHeader();
    const i2 = $("#bpq");
    if (i2) { i2.focus(); try { i2.setSelectionRange(at, at); } catch (err) {} }
    return;
  }
  if (e.target && ["bnum", "bwhat", "bhow", "bunit"].includes(e.target.id)) paintPreview();
  if (e.target && e.target.dataset && e.target.dataset.df) {
    const d = S.drafts.find(x => x.id === e.target.dataset.dd);
    if (d) d.body[e.target.dataset.df] = e.target.value;
    e.target.style.height = "auto";
    e.target.style.height = Math.max(42, e.target.scrollHeight + 2) + "px";
    relayoutMargin();
  }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset && el.dataset.set) {
    await setSetting(el.dataset.set, el.value);
    toast("saved");
    if (["version", "serif", "red_letters", "footnotes"].includes(el.dataset.set)
        && S.reader) refreshReaderMarks();
    return;
  }
  if (el.dataset && el.dataset.dkind) {      /* the method of one open box */
    readDrafts();
    const d = S.drafts.find(x => x.id === el.dataset.dkind);
    if (d) { d.kind = el.value; S.journalKind = el.value; }
    return renderComments();
  }
  if (["bwhat", "bhow", "bnum", "bunit"].includes(el.id)) return paintPreview();
  if (el.id === "showlooks") { S.log.looks = el.checked; return renderLog(); }
  if (el.id === "yearpick") { S.log.year = Number(el.value); return renderLog(); }
  if (el.id === "recitecb") { S.keep.recite = el.checked; return paintKeep(); }
  if (["jbook", "jkind", "jq"].includes(el.id)) {
    S.journal.filter = { abbr: ($("#jbook") || {}).value || "",
      kind: ($("#jkind") || {}).value || "", q: ($("#jq") || {}).value || "", starred: 0 };
    return renderKeep();
  }
});
$("#themeb").addEventListener("click", () =>
  setSetting("theme", st("theme") === "dark" ? "light" : "dark"));
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h && h !== S.tab && TABS.some(t => t.id === h)) go(h);
});

/* ================================================================== boot */
(async function () {
  S.boot = await API("/api/boot");
  if (!S.boot || S.boot.error) {
    document.body.innerHTML = "<div class='empty'>abide could not start. Is the server running?</div>";
    return;
  }
  applySettings();
  staleBanner();
  const h = location.hash.slice(1);
  await go(TABS.some(t => t.id === h) ? h : "today");
})();
</script>
</body>
</html>
